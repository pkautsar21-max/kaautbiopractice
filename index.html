"e":"Darwin: descent with modification and natural selection. All organisms descend from an ancestor and accumulate adaptations.","a":"descent with modification"},{"e":"Homologous structures: from a common ancestor, modified for different functions, product of divergent evolution (forelimbs).","a":"divergent evolution"},{"e":"Analogous structures: similar function but different ancestry, product of convergent evolution (wings; stem succulence of cacti and Euphorbias).","a":"convergent evolution"},{"e":"Bat and bird wings are homologous as forelimbs but analogous as wings. The more complex the similar structures, the more likely they are homologous.","a":"more complex"},{"e":"Gradualism: a continuous series of small mutations gives a new species. Punctuated equilibrium: rapid evolution when a few gene mutations give a new species in a short time.","a":"punctuated equilibrium"}],"kw":["Lamarckism","Darwinism","Homologous","Analogous","Convergent evolution","Gradualism","Punctuated equilibrium"],"tp":["Lamarck = acquired traits inherited (wrong). Darwin = natural selection."]}],"m":["**Variation** = differences within a species. **Continuous** = gradation. **Discontinuous** = distinct forms.","**Natural selection** = differential reproductive success.","**Directional** one extreme, **disruptive** both extremes, **stabilising** intermediates.","**Allopatric** = geographical isolation. **Sympatric** = same habitat.","**Prezygotic** (5 barriers) and **postzygotic** (3 barriers).","**Bottleneck** and **founder** are the two types of genetic drift.","**Lamarck:** use and disuse. **Darwin:** natural selection.","**Gradualism** (slow) vs **punctuated equilibrium** (rapid)."],"x":[{"k":10,"q":"Q1 (Variation)\na) Give two examples of discontinuous variation. (2M)\nb) Differentiate continuous and discontinuous variation. (4M)\nc) State the sources of variation. (4M)","a":["a) Blood type and fingerprints","b) Continuous: gradation between two extremes, quantitative, genes + environment (height, weight)","b) Discontinuous: distinct forms, no gradation, qualitative, genetic","c) Sexual reproduction: random fertilisation","c) Random assortment of chromosomes","c) Hybridisation","c) Environmental factors"]},{"k":10,"q":"Q2 (Speciation)\na) Differentiate allopatric and sympatric speciation. (4M)\nb) Name the five prezygotic barriers. (3M)\nc) Name the three postzygotic barriers. (3M)","a":["a) Allopatric: population split into geographically isolated populations that evolve independently","a) Sympatric: species diverge in the same habitat, non-geographical","b) Habitat, temporal, behavioural, mechanical, gametic isolation","c) Zygotic mortality, hybrid inviability, hybrid sterility"]},{"k":10,"q":"Q3 (Genetic drift, figure)\nA figure shows a small group leaving an original population, growing in a new location with different proportions of types.\na) Name this situation. (1M)\nb) Describe the situation. (3M)\nc) Differentiate bottleneck and founder effects. (3M)\nd) State the effect of genetic drift on genetic variation. (3M)","a":["a) Founder effect (type of genetic drift)","b) A few individuals isolated from a larger population colonise a new area","b) The colonists do not represent the gene pool of the original population","b) Allele frequencies in the new population differ by chance","c) Bottleneck: disaster reduces population size, survivors not representative","c) Founder: a few individuals colonise an isolated area (Pitcairn Island)","d) Reduces genetic variation by loss of alleles","d) Strongest in small populations; harmful alleles may become fixed"]},{"k":10,"q":"Q4 (Selection and evolution)\na) Differentiate Lamarckism and Darwinism. (4M)\nb) Describe the three modes of natural selection. (3M)\nc) Differentiate gradualism and punctuated equilibrium. (3M)","a":["a) Lamarck: use and disuse, inheritance of acquired characteristics (giraffe neck), refuted","a) Darwin: natural selection and descent with modification","b) Directional: one extreme favoured","b) Disruptive: both extremes favoured","b) Stabilising: intermediate favoured","c) Gradualism: continuous series of small mutations","c) Punctuated equilibrium: rapid change from a few gene mutations in a short time"]}]},{"n":13,"t":"Population Genetics","o":[{"t":"Define the **key genetic terms** and the **gene pool**.","f":[{"e":"Gene: basic unit of heredity made of DNA that carries genetic information (e.g. instructions to make a specific protein).","a":"unit of heredity"},{"e":"Allele: forms of the same gene with small differences in DNA base sequence. Locus: the location of the gene on the chromosome.","a":"locus"},{"e":"Phenotype: physical appearance. Genotype: specific combination of alleles.","a":"combination of alleles"},{"e":"Homozygous: two copies of the same allele (BB or bb). Heterozygous: two different alleles (Bb).","a":"heterozygous"},{"e":"A dominant allele masks a recessive allele if present.","a":"masks"},{"e":"Population: a group of organisms with similar features that can interbreed to produce fertile progeny. Gene pool: total of all alleles of all genes in a sexually reproducing population at a given time.","a":"gene pool"}],"kw":["Gene","Allele","Locus","Genotype","Phenotype","Homozygous","Heterozygous","Gene pool"],"tp":["Genotype = alleles you carry. Phenotype = what you look like."]},{"t":"Calculate **allele, genotype and phenotype frequencies**.","f":[{"e":"Allele frequency: p = frequency of the dominant allele, q = frequency of the recessive allele.","a":"p"},{"e":"Size of gene pool = 2 × number of individuals (diploid: two alleles each). Example: 10 000 plants → 20 000 alleles.","a":"2 ×"},{"e":"p = (2 × homozygous dominant + heterozygous) ÷ gene pool. Example: (2×6000 + 2000) ÷ 20 000 = 0.7.","a":"0.7"},{"e":"q = (2 × homozygous recessive + heterozygous) ÷ gene pool. Example: (2×2000 + 2000) ÷ 20 000 = 0.3.","a":"0.3"},{"e":"Mice: 98 BB, 84 Bb, 18 bb (200 mice) → gene pool 400, p = 0.7, q = 0.3.","a":"400"},{"e":"Genotype frequency = number with the genotype ÷ total individuals (e.g. 6000/10 000 = 0.6 AA; 2000/10 000 = 0.2 Aa; 0.2 aa).","a":"genotype frequency"},{"e":"Phenotype frequency = number with the phenotype ÷ total (tall = (6000+2000)/10 000 = 0.8; short = 0.2). MN blood group: MM 0.2980, MN 0.4890, NN 0.2130.","a":"phenotype frequency"},{"e":"Use up to four decimal places.","a":"four decimal places"}],"kw":["Allele frequency","p","q","Genotype frequency","Phenotype frequency","Gene pool size"],"tp":["Gene pool = 2 × N. p + q = 1.","Always give answers to 4 decimal places (e.g. straight hair 0.8750, curly 0.1250)."]},{"t":"Explain the **Hardy-Weinberg law** and equations.","f":[{"e":"Introduced in 1908 by G. H. Hardy (British mathematician) and W. Weinberg (German physician).","a":"1908"},{"e":"In a population at genetic equilibrium, allele frequencies remain constant from generation to generation. The principle describes a population that is not evolving.","a":"not evolving"},{"e":"p + q = 1.0 (allele frequencies).","a":"p + q = 1.0"},{"e":"p² + 2pq + q² = 1 (genotype frequencies): p² = homozygous dominant, 2pq = heterozygous, q² = homozygous recessive.","a":"2pq"},{"e":"Worked example: cystic fibrosis 1 in 2,500 → q² = 0.0004, q = 0.0200, p = 0.9800, p² = 0.9604, 2pq = 0.0392.","a":"0.0392"},{"e":"Lupin example: 25 pink (recessive) in 3316 → q² = 0.0075, q = 0.0866, p = 0.9134, p² = 0.8343, 2pq = 0.1582.","a":"0.0866"},{"e":"Method: recessive phenotype = q², so q = √q², then p = 1 − q.","a":"√q²"}],"kw":["Hardy-Weinberg","Genetic equilibrium","p + q = 1","p² + 2pq + q² = 1","Null hypothesis"],"tp":["Start from the RECESSIVE class: q² → q → p → p² and 2pq.","The slides have a typo on one slide (p² = 0.0980); the correct value is 0.9604."]},{"t":"State the **conditions for Hardy-Weinberg equilibrium** and why it matters.","f":[{"e":"Conditions: large population size, random mating and fertilisation, no natural selection, no net mutation, no migration, no overlapping of generations.","a":"no migration"},{"e":"If a population does not meet the criteria, it is evolving.","a":"evolving"},{"e":"Importance: lets researchers make quantitative predictions about genetic variation, and gives a null hypothesis for testing evolutionary change.","a":"null hypothesis"},{"e":"Not applicable in nature because: populations are not that big (genetic drift), mutations occur, individuals are not equally fertile, and mating is not random in big populations.","a":"genetic drift"}],"kw":["Large population","Random mating","No selection","No mutation","No migration"],"tp":["5 conditions to remember: large, random, no selection, no mutation, no migration (plus no overlapping generations)."]}],"m":["**Gene pool** = all alleles in a population. Size = **2N**.","**p** = dominant allele, **q** = recessive allele. **p + q = 1**.","**p² + 2pq + q² = 1**.","Recessive phenotype = **q²**. Take the square root for q.","Give answers to **4 decimal places**.","HW conditions: **large, random mating, no selection, no mutation, no migration**.","A population NOT in HW equilibrium is **evolving**."],"x":[{"k":10,"q":"Q1 (Hardy-Weinberg calculation)\na) Define allele and phenotype. (2M)\nb) A survey in North Africa found 0.04% of people have sickle-cell anaemia (bb). Determine the frequency of allele B and the genotype frequency for normal individuals. (4M)\nc) 230 of 400 individuals are Rh+ (dominant H). Calculate the number of heterozygous Rh+ individuals. (4M)","a":["a) Allele: forms of the same gene with small differences in DNA base sequence","a) Phenotype: physical appearance","b) q² = 0.0004, q = 0.0200","b) p = 1 − 0.0200 = 0.9800 (frequency of B)","b) Normal: BB = p² = 0.9604 and Bb = 2pq = 0.0392","c) Rh− = 170/400 = 0.4250 = q², q = 0.6519","c) p = 0.3481","c) 2pq = 0.4539","c) 0.4539 × 400 ≈ 182 heterozygotes"]},{"k":10,"q":"Q2 (Allele frequency)\nIn a population of 200 mice, 98 are BB, 84 are Bb and 18 are bb.\na) Define gene pool and allele frequency. (2M)\nb) Determine the gene pool size and p and q. (4M)\nc) State four conditions for Hardy-Weinberg equilibrium. (4M)","a":["a) Gene pool: all alleles of all genes in a sexually reproducing population","a) Allele frequency: ratio of times an allele appears in the population","b) Gene pool = 2 × 200 = 400","b) p = (2×98 + 84) ÷ 400 = 0.7000","b) q = (2×18 + 84) ÷ 400 = 0.3000","c) Large population, random mating","c) No natural selection, no net mutation","c) No migration; no overlapping generations (any 4)"]},{"k":10,"q":"Q3 (Using p² + 2pq + q² = 1)\na) State the two Hardy-Weinberg equations. (2M)\nb) Dwarf lupins: 25 pink (recessive) and 3291 blue in 3316 plants. Calculate q², q, p, p² and 2pq. (5M)\nc) Explain why the Hardy-Weinberg law does not apply in natural populations. (3M)","a":["a) p + q = 1","a) p² + 2pq + q² = 1","b) q² = 25/3316 = 0.0075","b) q = 0.0866, p = 0.9134","b) p² = 0.8343","b) 2pq = 0.1582","c) Populations are not very big, so genetic drift occurs","c) Mutations occur, individuals are not equally fertile, mating is not random"]},{"k":10,"q":"Q4 (Testing equilibrium)\nA wildflower population has 320 RR, 160 Rr and 20 rr plants.\na) Calculate the allele frequencies. (4M)\nb) Calculate the expected genotype frequencies. (3M)\nc) Is the population in Hardy-Weinberg equilibrium? Explain. (3M)","a":["a) R = (320×2 + 160) = 800; r = (20×2 + 160) = 200","a) p = 800/1000 = 0.8","a) q = 200/1000 = 0.2","b) p² = 0.64","b) 2pq = 0.32 and q² = 0.04","c) Observed = 320/500 = 0.64, 160/500 = 0.32, 20/500 = 0.04","c) Observed equals expected, so the population is in equilibrium (not evolving)"]}]},{"n":14,"t":"Ecology","o":[{"t":"Explain **biotic and abiotic components** and the **levels of ecological organisation**.","f":[{"e":"Ecology is the study of living organisms in their natural environment and their relationship with it.","a":"natural environment"},{"e":"Biotic (living): producers, consumers, saprophytes. Abiotic (non-living): climatic (temperature, humidity, light, wind), edaphic (pH, soil texture), topographic (angle of slope).","a":"edaphic"},{"e":"Levels: individual → population → community → ecosystem → biome → biosphere.","a":"biome"},{"e":"Population: a group of the same species in a habitat at the same time that can interbreed. Community: all organisms of all species in an area.","a":"all species"},{"e":"Ecosystem = community + abiotic environment, interacting. Biosphere = the global system, the sum of all ecosystems.","a":"abiotic environment"}],"kw":["Biotic","Abiotic","Population","Community","Ecosystem","Biome","Biosphere"],"tp":["Individual, Population, Community, Ecosystem, Biome, Biosphere."]},{"t":"Describe the **terrestrial biomes**.","f":[{"e":"Tropical rainforest: near the equator, 2,000–4,000 mm rain, 20–30°C; dipterocarps, orangutans, hornbills (Borneo, Amazon, Congo).","a":"2,000–4,000 mm"},{"e":"Temperate grassland: 250–750 mm, −20 to 30°C; prairie grasses, bison (Great Plains, Pampas, Steppes).","a":"250–750 mm"},{"e":"Temperate deciduous forest: 750–1,500 mm, four seasons; oak, maple, deer, bears.","a":"750–1,500 mm"},{"e":"Savanna: 500–1,500 mm with wet and dry seasons; acacia, zebras, lions (Serengeti).","a":"wet and dry seasons"},{"e":"Desert: less than 250 mm; cacti, camels, scorpions (Sahara, Gobi).","a":"less than 250 mm"},{"e":"Coniferous forest (taiga): 300–850 mm, mostly snow, high latitudes; pine, spruce, moose.","a":"taiga"},{"e":"Tundra: 150–250 mm, −30 to 10°C; mosses, lichens, arctic foxes.","a":"lichens"},{"e":"Temperate evergreen woodlands: 300–1,000 mm in cool wet winters; cork oak, olive (Mediterranean, California chaparral).","a":"Mediterranean"}],"kw":["Tropical rainforest","Temperate grassland","Deciduous forest","Savanna","Desert","Taiga","Tundra","Evergreen woodland"],"tp":["8 biomes: rainforest, temperate grassland, temperate deciduous forest, savanna, desert, taiga, tundra, temperate evergreen woodland."]},{"t":"Differentiate **population vs community**, and **habitat vs niche**.","f":[{"e":"Population: one species; community: two or more species.","a":"two or more species"},{"e":"Population focus: size, density, distribution, growth. Community focus: species diversity, composition and interactions.","a":"species diversity"},{"e":"Habitat describes WHERE an organism lives; it provides food, water, shelter. A microhabitat is a much smaller, specialised habitat (under a leaf, tree cavity).","a":"WHERE"},{"e":"Niche describes HOW an organism lives and what it does in the ecosystem (feeding, activity pattern, resources, interactions).","a":"HOW"},{"e":"Different species may share a habitat but occupy different niches.","a":"different niches"}],"kw":["Habitat","Microhabitat","Niche","Population","Community"],"tp":["Habitat = address (where). Niche = job (how)."]},{"t":"Explain **energy flow**, food chains, food webs, trophic levels and ecological pyramids.","f":[{"e":"The Sun is the primary energy source. Producers convert light energy to chemical energy. Energy flows in one direction (unidirectional) and is lost as heat.","a":"unidirectional"},{"e":"Producers (autotrophs); primary consumers (herbivores); secondary consumers (feed on primary); tertiary consumers (feed on secondary); decomposers (fungi, bacteria) release inorganic nutrients.","a":"decomposers"},{"e":"A food chain is a linear sequence of energy transfer starting with a producer; arrows point from the eaten to the consumer.","a":"linear sequence"},{"e":"A food web is a network of interconnected food chains; gives alternative energy sources when food is scarce.","a":"network"},{"e":"Energy decreases at each trophic level due to respiration (heat), movement and maintenance, uneaten biomass, and waste/undigested material.","a":"respiration"},{"e":"10% rule: only about 10% of energy at one trophic level becomes biomass at the next; about 90% is not transferred.","a":"10%"},{"e":"Pyramid of numbers (individuals), pyramid of biomass (dry mass), pyramid of energy (rate of energy transfer per area per time).","a":"pyramid of biomass"}],"kw":["Producer","Consumer","Decomposer","Food chain","Food web","Trophic level","10% rule","Ecological pyramid"],"tp":["Energy flows ONE way. Only ~10% passes on."]},{"t":"Describe **biogeochemical cycles** (water, carbon, nitrogen).","f":[{"e":"Biogeochemical cycles are natural processes that circulate chemical elements between living organisms and the non-living environment; matter is recycled.","a":"recycled"},{"e":"Importance: recycle nutrients, maintain productivity, regulate environmental conditions, support biological processes, maintain ecosystem balance.","a":"maintain ecosystem balance"},{"e":"Water cycle: continuous movement of water between Earth's surface, atmosphere and organisms; maintains freshwater, regulates climate, supports photosynthesis, transports nutrients.","a":"freshwater"},{"e":"Carbon cycle: carbon moves between atmosphere, organisms, oceans, soils and geological reservoirs; supplies carbon for biomolecules and regulates atmospheric CO₂.","a":"regulates"},{"e":"Nitrogen cycle: nitrogen moves between atmosphere, soil, water and organisms; supplies nitrogen for amino acids, proteins, DNA, RNA and chlorophyll and maintains soil fertility.","a":"amino acids"}],"kw":["Biogeochemical cycle","Water cycle","Carbon cycle","Nitrogen cycle"],"tp":["Water = freshwater/climate. Carbon = biomolecules/CO₂. Nitrogen = proteins/DNA."]},{"t":"Explain **population growth** and **quantitative ecology**.","f":[{"e":"Population size changes through natality (birth) and immigration (increase), mortality (death) and emigration (decrease).","a":"emigration"},{"e":"J-shaped curve: accelerating growth, unlimited resources, no environmental resistance.","a":"J-shaped"},{"e":"S-shaped (sigmoid) curve: slow start, acceleration, then slows as resources become limited and size approaches carrying capacity (K).","a":"carrying capacity"},{"e":"Quantitative ecology uses numerical measurements, statistics and models to estimate population size, density, abundance, distribution and species richness.","a":"species richness"},{"e":"Quadrat sampling: a square frame of known area (e.g. 0.25 m² or 1 m²) to estimate abundance, density, frequency or percentage cover; suited to plants and slow-moving organisms.","a":"quadrat"},{"e":"Capture–mark–recapture estimates mobile populations. Lincoln Index: population = (n₁ × n₂) ÷ n₃, where n₁ = first marked and released, n₂ = second capture, n₃ = marked individuals recaptured.","a":"Lincoln Index"}],"kw":["Natality","Mortality","Immigration","Emigration","Carrying capacity","Quadrat","Lincoln Index"],"tp":["N = (n₁ × n₂) ÷ n₃.","BIDE: Births + Immigration − Deaths − Emigration.","Your slide labels capture–mark–recapture as 'Method 1' again; it is the second method."]}],"m":["**Levels:** individual, population, community, ecosystem, biome, biosphere.","**Habitat** = where. **Niche** = how/what it does.","**Energy** flows one way; only about **10%** is passed on.","**Producers → primary → secondary → tertiary consumers**, plus decomposers.","**J curve** = no limit. **S curve** = levels off at carrying capacity (K).","**Natality + immigration** raise size; **mortality + emigration** lower it.","**Quadrat** for plants/sessile organisms. **Lincoln Index** for mobile animals.","**Lincoln Index:** N = (n₁ × n₂) ÷ n₃."],"x":[{"k":10,"q":"Q1 (Levels of organisation)\na) Differentiate biotic and abiotic components with two examples each. (3M)\nb) State the six levels of ecological organisation. (3M)\nc) Differentiate population and community. (4M)","a":["a) Biotic: living (producers, consumers, saprophytes)","a) Abiotic: non-living (temperature, humidity, soil pH, slope)","b) Individual, population, community, ecosystem, biome, biosphere","c) Population: one species in an area at the same time","c) Community: populations of different species (two or more) interacting","c) Population focus: size, density, growth; community focus: diversity and interactions"]},{"k":10,"q":"Q2 (Biomes, habitat, niche)\na) List two examples of biomes. (2M)\nb) Differentiate habitat and niche. (4M)\nc) Describe the tropical rainforest biome. (4M)","a":["a) Any two: tropical rainforest, savanna, desert, tundra, taiga, temperate grassland, temperate deciduous forest, temperate evergreen woodland","b) Habitat: where an organism lives","b) Niche: how it lives and what it does in the ecosystem","b) Different species can share a habitat but have different niches","c) Near the equator, 2,000–4,000 mm rain, 20–30°C","c) Tall evergreen trees, dipterocarps, orchids, ferns","c) Orangutans, hornbills, monkeys (Borneo, Amazon)"]},{"k":10,"q":"Q3 (Energy flow)\na) Explain energy flow through an ecosystem. (4M)\nb) State three reasons energy decreases at each trophic level. (3M)\nc) A producer level stores 10,000 kJ. Using the 10% rule, how much reaches the primary and secondary consumers? (3M)","a":["a) Sun is the primary source; producers convert light to chemical energy","a) Energy passes through trophic levels by feeding","a) Flow is one-way (unidirectional); lost as heat","a) Decomposers break down dead matter","b) Respiration/heat, movement and maintenance, uneaten biomass, waste","c) Primary consumers ≈ 1,000 kJ","c) Secondary consumers ≈ 100 kJ"]},{"k":10,"q":"Q4 (Population growth and sampling)\na) Differentiate J and S growth curves. (4M)\nb) An experiment estimates dragonflies in a field: 10 captured, marked, released; 15 captured later; 6 marked recaptured. Why are the first captured dragonflies released back? (2M)\nc) Calculate the population size using the formula. (2M)\nd) State two factors that increase population size. (2M)","a":["a) J: accelerating growth, unlimited resources, no environmental resistance","a) S: slow start, acceleration, then slows and levels off at carrying capacity (K)","b) So marked individuals mix back into the population","b) So the second capture is a fair sample for estimation","c) N = (n₁ × n₂) ÷ n₃","c) N = (10 × 15) ÷ 6 = 25","d) Natality (births) and immigration"]},{"k":10,"q":"Q5 (Cycles and quadrats)\na) Define biogeochemical cycle. (2M)\nb) State three importances of biogeochemical cycles. (3M)\nc) State the importance of the carbon cycle and the nitrogen cycle. (3M)\nd) What is quadrat sampling and when is it used? (2M)","a":["a) Natural processes that circulate chemical elements between organisms and the non-living environment","b) Recycle essential nutrients","b) Maintain ecosystem productivity and balance","b) Regulate environmental conditions and support biological processes","c) Carbon: carbohydrates, lipids, proteins, nucleic acids; regulates atmospheric CO₂","c) Nitrogen: amino acids, proteins, DNA, RNA, chlorophyll; soil fertility","d) Square frame of known area to estimate abundance/density/cover","d) Used for plants and sessile or slow-moving organisms"]}]}],I=["data:image/webp;base64,UklGRqwmAABXRUJQVlA4WAoAAAAQAAAA2wAA2wAAQUxQSEMJAAAB8Ib///m2///dk7opk3fbtZ1tFLNt2/b6nv2ybfXVl1+v2bZtt/NW226S24kiyfP5eNxzNiImgMRuCBm8cnPkksnd6zqSfalttXRrTJ4J5UuSTyyqaUfoxh0vhIXxGz3shaGXYc3TvewC/ZelsG7WYDug8WVYPaMv++regw3TpjKv1i3YtLAX6zR/wcZxoZxzjbEVLngwzveVzbCOcW4xtosL4pvmSwAPD5+9mVhsNbzJN3Kd/eUsb3Jwq9Vx0f4UK93T8a3KmrrrnlrFONAuIKLA1S+sgCh7gaj2bivEV7MbyHlpnkUYYz8Q9U6waKeDHUGdoy3Jb2JPUN3bFhSH2BXUMqVq+c3tBkcfvwbBNb8yVyk9yB7waDBx/b8Xn73OSEzNqlpmTe5p6o39524mrFzciog0+vodxry37s2fNv23f/OH88b1CQ3mUqPlhzJhy6HBwz8/9jSjDFU2FcYd/W5xmAd3nIfuTYNtzfcSYPXC2+/39WCM99obUPvDb1oxpfqaWxBh5kfBDPH/NB6ifD5DywyHmdEQ6S49K5rtgWCP1WPE9EQI92EXLui/MUHAeR87s6D5OQh6UwADRr6GsG+FyS74xzIIPGWw1JzmPYPYM2dIrO4+CN/4nrRGvIQM35eSb+fPiyHHtULzd7fI0a1OvzXbn5kgS1OEuEJ3x93Z/f7wjk1r1vCr3y2899QlH5+/mW6GVMtmiSrwOSo05qamvkw3lpgh5YKxghoCHmYPFNMEJiC9m5DmcwHx3UX0LhuQt85dPBF8AG6MFk5bIyNg+jNEIxavx5wACk7ONoiE3uUFgOd/T2/lrSmn67DigwlB6gp6yQ0A+dGnNkVuPXCvBEDyDzo10bASfli6QVU0OY85h9RFI1J5c0Rl1GJrEWei1EYU/tGNDLbMVR+R+1aupNYWwTsmrrxFAhxaDKYecBVAuwww9Vx1Ur/3VfDU/K+BBPh/8DR2OonQ9wVL8v9sQEKcCX6an/4YQmL0ecqPkz28SZQDwc9HbiTM7xmC94Whj+VIf  if(tab=='ex')h+=`<p class="row">Each question is 10 marks like the finals (a, b, c). Write your answer first, then reveal the marking scheme and tick the points you got 💪</p>`+d.x.map((x,i)=>`<div class="card" style="animation-delay:${i*.1}s"><p style="margin:0"><span class="mk">${x.k} marks</span><b style="white-space:pre-line;display:block;margin-top:6px">${esc(x.q)}</b></p><textarea placeholder="Type your answer here (not saved)…"></textarea><button class="go" onclick="rv(${i},this)">Reveal marking scheme ✨</button><div id="ms${i}"></div></div>`).join('');
 app.innerHTML=h}
function tg(i,el){const d=D[ch],k='lo'+d.n,a=store.g(k)||[];a[i]=el.checked;store.s(k,a);if(el.checked){const r=el.getBoundingClientRect();burst(r.left,r.top)}render()}
function rv(i,btn){const x=D[ch].x[i];btn.style.display='none';document.getElementById('ms'+i).innerHTML=`<div class="ms">`+x.a.map((p,j)=>`<label><input type="checkbox" onchange="sc(${i},this)"><span>${esc(p)}</span></label>`).join('')+`<div class="sc" id="sc${i}">0 / ${x.a.length} points</div></div>`}
function sc(i,el){el.parentNode.classList.toggle('t',el.checked);const b=document.getElementById('ms'+i),n=b.querySelectorAll('input:checked').length,t=b.querySelectorAll('input').length;document.getElementById('sc'+i).textContent=n+' / '+t+' points'+(n==t?' 🎉 Full marks!':'');if(n==t){const r=el.getBoundingClientRect();burst(r.left,r.top);cheer(mas)}}
/* ---------- account + cloud sync ---------- */
const AUTHK='bio-auth',TSK='lo_t';
let auth=store.g(AUTHK),syncT=null,syncing=false,again=false,dirty=false,status='',panel=false,mode='in';
const tsAll=()=>store.g(TSK)||{};
function stampLo(k){const t=tsAll();t[k]=Date.now();localStorage.setItem(TSK,JSON.stringify(t))}
function setStatus(s){status=s;const e=document.getElementById('acst');if(e)e.textContent=s}
function schedSync(){if(!auth)return;dirty=true;clearTimeout(syncT);syncT=setTimeout(sync,700);setStatus('Saving…')}
function localData(){const T=tsAll(),o={};for(const d of D){const k='lo'+d.n,a=store.g(k);if(!a&&!T[k])continue;
 o[k]={a:Array.from({length:d.o.length},(_,i)=>!!(a&&a[i])),t:T[k]||0}}return o}
function applyData(m){let changed=false;const T=tsAll();
 for(const [k,v] of Object.entries(m||{})){const d=D.find(x=>'lo'+x.n===k);if(!d||!v||!Array.isArray(v.a))continue;
  if((T[k]||0)>v.t)continue; // changed on this device while the request was in flight
  const a=Array.from({length:d.o.length},(_,i)=>!!v.a[i]),cur=store.g(k)||[];
  if(!a.every((x,i)=>x===!!cur[i])){localStorage.setItem(k,JSON.stringify(a));changed=true}
  T[k]=v.t}
 localStorage.setItem(TSK,JSON.stringify(T));return changed}
async function call(path,body,method='POST'){
 const r=await fetch(path,{method,headers:{'content-type':'application/json',...(auth?{authorization:'Bearer '+auth.k}:{})},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Object.assign(new Error(j.error||'Couldn’t reach the server. Try again in a moment.'),{status:r.status});return j}
async function sync(){if(!auth)return;if(syncing){again=true;return}
 syncing=true;setStatus('Saving…');
 try{const j=await call('/api/progress',{data:localData()});dirty=false;setStatus('Saved ✓');
  if(applyData(j.data)&&tab=='lo')render()}
 catch(e){if(e.status===401){auth=null;localStorage.removeItem(AUTHK);status='';drawAcct('Please log in again to keep saving.')}
  else{dirty=true;setStatus('Offline, will retry')}}
 finally{syncing=false;if(again){again=false;schedSync()}}}
function drawAcct(note){const el=document.getElementById('acct');if(!el)return;
 if(auth){el.innerHTML=`<div class="acbar"><span>☁️ Saved to <b>@${esc(auth.u)}</b> · <span id="acst">${esc(status)}</span></span><button class="go sm" onclick="acOut()">Log out</button></div>`;return}
 el.innerHTML=`<div class="acbar"><span>${esc(note||'💾 Saved on this device only. Make an account to keep your progress on any phone or computer.')}</span><button class="go sm" onclick="acTog()">${panel?'Close':'Save to an account'}</button></div>`+(panel?
 `<div class="acpanel"><div class="actabs"><button class="${mode=='up'?'on':''}" onclick="acMode('up')">Create account</button><button class="${mode=='in'?'on':''}" onclick="acMode('in')">Log in</button></div>
 <form onsubmit="acSubmit(event)"><label>Username<input id="acu" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
 <label>Password<input id="acp" type="password" minlength="6" autocomplete="${mode=='up'?'new-password':'current-password'}" required></label>
 <button class="go" type="submit">${mode=='up'?'Create account':'Log in'}</button><p class="acerr" id="acerr" role="alert"></p>${mode=='up'?'<p class="acnote">No email needed, so write your password down somewhere safe. It can’t be recovered.</p>':''}</form></div>`:'')}
function acTog(){panel=!panel;drawAcct()}
function acMode(m){const u=document.getElementById('acu');const keep=u?u.value:'';mode=m;drawAcct();const n=document.getElementById('acu');if(n)n.value=keep}
async function acSubmit(e){e.preventDefault();const u=document.getElementById('acu').value.trim().toLowerCase(),p=document.getElementById('acp').value,err=document.getElementById('acerr'),btn=e.target.querySelector('button[type=submit]');
 err.textContent='';btn.disabled=true;
 try{if(!/^[a-z0-9_.-]{3,20}$/.test(u))throw new Error('Usernames need 3–20 letters, numbers, dots, dashes or underscores.');
  if(mode=='up'&&p.length<6)throw new Error('Passwords need at least 6 characters.');
  auth=null;const j=await call('/api/account',{action:mode=='up'?'register':'login',username:u,password:p});
  auth={u:j.username,k:j.token};localStorage.setItem(AUTHK,JSON.stringify(auth));panel=false;drawAcct();setStatus('Saving…');await sync();try{cheer(mas)}catch(_){}}
 catch(x){auth=store.g(AUTHK);err.textContent=x.message}finally{btn.disabled=false}}
async function acOut(){if(dirty)await sync();
 if(dirty&&!confirm('Some changes haven’t been saved yet. Log out anyway?'))return;
 if(!confirm('Log out? Your progress stays in your account, so log in again any time to get it back.'))return;
 try{await call('/api/account',{action:'logout'})}catch(e){}
 localStorage.removeItem(AUTHK);auth=null;dirty=false;status='';
 for(const d of D)localStorage.removeItem('lo'+d.n);localStorage.removeItem(TSK);drawAcct();render()}
addEventListener('online',()=>{if(auth)sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth)sync()});
render();drawAcct();if(auth)sync();
</script></body></html>
