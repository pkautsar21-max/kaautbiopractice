<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#14101f;--card:#211a35;--card2:#2a2145;--tx:#f1eaff;--mu:#a99cc9;--pk:#ff8fc7;--lv:#b79cff;--mint:#7be0c3;--yl:#ffe08a;--bd:#3b2f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.55 'Fredoka',system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2b1d4d,transparent 50%),radial-gradient(circle at 90% 30%,#3a1b46,transparent 45%),var(--bg);min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}.stars i{position:absolute;color:var(--yl);animation:tw 3s ease-in-out infinite;opacity:.0}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6) rotate(0)}50%{opacity:.9;transform:scale(1.2) rotate(25deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes shine{0%{background-position:0}100%{background-position:200%}}
header,.chs,main{position:relative;z-index:1;max-width:840px;margin:auto}
header{display:flex;align-items:center;gap:14px;padding:22px 16px 6px}
header img{width:84px;height:84px;object-fit:contain;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0008);cursor:pointer}
h1{margin:0;font-size:27px;background:linear-gradient(90deg,var(--pk),var(--lv),var(--mint),var(--pk));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
.chs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.chs button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer;font:inherit;font-weight:500;transition:.2s}
.chs button img{width:30px;height:30px;object-fit:contain}.chs button:hover{transform:translateY(-3px);border-color:var(--lv)}
.chs button.on{background:linear-gradient(135deg,var(--pk),var(--lv));color:#1b1030;border-color:transparent;font-weight:700}.chs button.on img{animation:wob 1.2s ease-in-out infinite}
main{padding:4px 16px 50px}h2{margin:10px 0 2px;font-size:21px;animation:pop .5s both}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.sub button{border:2px dashed var(--bd);background:transparent;color:var(--mu);border-radius:14px;padding:8px 14px;cursor:pointer;font:inherit;transition:.2s}
.sub button:hover{color:var(--tx);transform:scale(1.05)}.sub button.on{border:2px solid var(--pk);color:var(--pk);background:#ff8fc71a}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px 16px;margin-bottom:12px;animation:pop .5s both;transition:.2s}
.card:hover{border-color:var(--lv);transform:translateY(-2px)}
.lo{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.lo input{margin-top:4px;width:20px;height:20px;accent-color:var(--pk)}.lo.done span{color:var(--mu);text-decoration:line-through}
.bar{height:12px;background:var(--card);border:2px solid var(--bd);border-radius:12px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--yl));border-radius:12px;transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.mr{background:linear-gradient(135deg,#3a2f12,#2a2145);border:2px solid var(--yl);border-radius:20px;padding:13px 16px 13px 46px;margin-bottom:12px;position:relative;animation:pop .5s both}
.mr:before{content:'⭐';position:absolute;left:14px;top:12px;font-size:20px;animation:wob 2s ease-in-out infinite}.mr b{color:var(--yl)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.mk{display:inline-block;background:var(--pk);color:#1b1030;border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;margin-right:8px}
.go{background:linear-gradient(135deg,var(--pk),var(--lv));color:#1b1030;border:0;border-radius:14px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}.go:hover{transform:scale(1.07) rotate(-1deg)}
textarea{width:100%;min-height:70px;margin:10px 0;border-radius:14px;border:2px solid var(--bd);background:var(--card2);color:var(--tx);padding:10px;font:inherit;resize:vertical}textarea:focus{outline:none;border-color:var(--mint)}
.ms{margin-top:12px;animation:pop .4s both}.ms label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:12px;cursor:pointer;margin-bottom:4px;background:var(--card2)}.ms label.t{background:#7be0c32a}.ms input{margin-top:5px;accent-color:var(--mint);width:18px;height:18px}
.sc{font-weight:700;color:var(--mint);margin:8px 0}
.cf{position:fixed;pointer-events:none;z-index:9;font-size:22px;animation:fly 1s ease-out forwards}
.tgl{margin:8px 0 0 32px;background:var(--card2);border:2px solid var(--bd);color:var(--lv);border-radius:12px;padding:6px 12px;font:inherit;cursor:pointer;transition:.2s}.tgl:hover{border-color:var(--lv);transform:scale(1.04)}
.det{margin:12px 0 0 0;animation:pop .35s both}.det h4{margin:12px 0 6px;color:var(--pk);font-size:15px}.det ol{margin:0;padding-left:22px}.det li{margin-bottom:7px}
mark{background:#ffe08a2e;color:var(--yl);border-radius:6px;padding:0 4px;font-weight:600}
.kw{display:inline-block;background:#b79cff26;border:1px solid var(--lv);color:var(--tx);border-radius:999px;padding:1px 10px;margin:0 6px 6px 0;font-size:13px}
.tipbox{background:#7be0c31f;border-left:4px solid var(--mint);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}.chk{color:var(--mu);font-size:13px;margin-top:10px}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.acct{position:relative;z-index:1;max-width:840px;margin:4px auto 0;padding:0 16px}
.acbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;color:var(--mu);font-size:14px}
.acbar b{color:var(--tx)}.go.sm{padding:5px 14px;font-size:14px;border-radius:12px}
.acpanel{margin-top:8px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px}
.actabs{display:flex;gap:8px;margin-bottom:10px}.actabs button{flex:1;border:2px dashed var(--bd);background:var(--card2);color:var(--tx);border-radius:12px;padding:6px;font:inherit;cursor:pointer}
.actabs button.on{background:linear-gradient(135deg,var(--pk),var(--lv));color:#1b1030;border-color:transparent;font-weight:700}
.acpanel label{display:block;color:var(--mu);font-size:14px}
.acpanel input{display:block;width:100%;margin:4px 0 10px;padding:9px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit}
.acpanel input:focus{outline:none;border-color:var(--mint)}
.acerr{color:#ff9aa8;margin:8px 0 0;min-height:1em;font-size:14px}.acnote{color:var(--mu);font-size:13px;margin:6px 0 0}
</style></head><body>

<script>
const D=[{"n":8,"t":"Reproduction (Human & Plant)","o":[{"t":"Describe the **male reproductive system**: parts, functions and the pathway of sperm.","f":[{"e":"The testis (testicle) produces sperm and testosterone.","a":"testosterone"},{"e":"The scrotum protects the testicles.","a":"protects"},{"e":"The epididymis carries and stores the sperm cells that were produced.","a":"stores"},{"e":"The vas deferens transports mature sperm to the urethra for ejaculation.","a":"mature sperm"},{"e":"The seminal vesicle makes up to 80% of the ejaculatory fluid.","a":"80%"},{"e":"The prostate adds additional fluid to the ejaculatory fluid.","a":"additional fluid"},{"e":"The ejaculatory duct transports sperm from the vas deferens to the urethra.","a":"ejaculatory duct"},{"e":"The urethra carries urine out of the body, and the penis delivers semen into the female reproductive organ.","a":"urine"},{"e":"Sperm pathway: seminiferous tubules/testis → epididymis → vas deferens → ejaculatory duct → urethra.","a":"epididymis"}],"kw":["Testis","Scrotum","Epididymis","Vas deferens","Seminal vesicle","Prostate","Ejaculatory duct","Urethra","Penis"],"tp":["Key components on the slide: testis, vas deferens, prostate, penis, urethra, scrotum, epididymis.","Seminal vesicle = up to 80% of semen. Prostate = adds extra fluid."]},{"t":"Describe the **female reproductive system**: parts, functions and the pathway of the ovum.","f":[{"e":"The ovaries are small, oval-shaped glands that produce ovum and hormones.","a":"ovum and hormones"},{"e":"The fimbriae sweep the matured ovum from the ovary to the fallopian tube.","a":"sweep"},{"e":"The fallopian tube is the pathway for the ovum to travel from the ovaries to the uterus, and the site of fertilisation.","a":"site of fertilisation"},{"e":"The uterus is the site for implantation of a fertilised egg, so the embryo can develop into a fetus.","a":"implantation"},{"e":"The cervix is the narrow portion of the uterus that connects the uterus to the vagina.","a":"narrow portion"},{"e":"The vagina is a fibromuscular canal serving as the birth canal and the passageway for menstrual fluid to exit.","a":"birth canal"},{"e":"Ovum pathway: ovary → fimbriae → fallopian tube (oviduct) → uterus.","a":"fimbriae"}],"kw":["Ovary","Fimbriae","Fallopian tube","Uterus","Cervix","Vagina"],"tp":["Key components on the slide: ovaries, fimbriae, fallopian tubes, uterus, cervix, vagina."]},{"t":"Describe **spermatogenesis**.","f":[{"e":"Gametogenesis is the process through which specialised sex cells (gametes) are formed in organisms that reproduce sexually.","a":"gametes"},{"e":"Spermatogenesis occurs inside the seminiferous tubules, a convoluted cluster of tubes in the testes.","a":"seminiferous tubules"},{"e":"It takes approximately 64–74 days.","a":"64–74 days"},{"e":"Production is continuous from puberty throughout the male's reproductive life.","a":"continuous"},{"e":"3 stages: (i) mitosis (spermatogonia → two spermatocytes), (ii) meiosis (spermatocytes → spermatids), (iii) spermiogenesis (spermatids → sperm).","a":"spermiogenesis"},{"e":"Spermatogonia and primary spermatocytes are diploid; spermatids and spermatozoa are haploid. One primary spermatocyte gives four sperm.","a":"four sperm"}],"kw":["Seminiferous tubules","64–74 days","Mitosis","Meiosis","Spermiogenesis","Spermatogonia","Spermatids"],"tp":["Order: MITOSIS → MEIOSIS → SPERMIOGENESIS (3 stages)."]},{"t":"Describe **oogenesis** (5 stages).","f":[{"e":"Oogenesis occurs inside the ovaries and starts very early: from the embryonic/foetal stage, then puberty, until menopause.","a":"menopause"},{"e":"Stage 1 (before birth): oogonia (2n) divide by mitosis; primary oocytes (2n) begin meiosis I but stop at prophase I and are surrounded by follicle cells (primordial follicle).","a":"prophase I"},{"e":"A female is born with primary oocytes already present in her ovaries.","a":"born with primary oocytes"},{"e":"Stage 2 (from puberty): primordial follicle → primary follicle → growing follicle → mature follicle. Usually one follicle becomes the dominant mature follicle.","a":"mature follicle"},{"e":"Stage 3: just before ovulation the primary oocyte completes meiosis I: primary oocyte (2n) → secondary oocyte (n) + first polar body (n). Cytoplasm divides unequally; the secondary oocyte gets most of it.","a":"first polar body"},{"e":"Stage 4 (ovulation): the secondary oocyte starts meiosis II and stops at metaphase II. The mature follicle ruptures and releases it. The remaining follicle becomes the corpus luteum.","a":"metaphase II"},{"e":"The cell released at ovulation is a secondary oocyte, not a fully mature ovum.","a":"secondary oocyte"},{"e":"Stage 5: only if a sperm fertilises it, meiosis II is completed: secondary oocyte → ovum (n) + second polar body (n). Ovum (n) + sperm (n) → zygote (2n).","a":"zygote"},{"e":"If fertilisation does not occur, the secondary oocyte degenerates and meiosis II is not completed.","a":"degenerates"}],"kw":["Oogonia","Primary oocyte","Prophase I","Primordial follicle","Secondary oocyte","Polar body","Metaphase II","Corpus luteum"],"tp":["Arrest points: PROPHASE I (before birth) and METAPHASE II (at ovulation).","Meiosis II finishes only if fertilised."]},{"t":"Describe the structure of a **sperm** and an **egg**.","f":[{"e":"A sperm has three sections: head, mid-piece and tail.","a":"head, mid-piece and tail"},{"e":"The head has the haploid nucleus (paternal DNA), the acrosome cap and centrioles.","a":"acrosome cap"},{"e":"The acrosome cap contains hydrolytic enzymes to penetrate the jelly coat of the egg.","a":"hydrolytic enzymes"},{"e":"The centrioles are needed by a zygote in order to divide.","a":"centrioles"},{"e":"The mid-piece has many mitochondria that provide the ATP needed for the tail to move.","a":"mitochondria"},{"e":"The tail (flagellum) is a microtubule structure called the axoneme, which bends to facilitate movement.","a":"axoneme"},{"e":"The egg is surrounded by two layers: the zona pellucida (jelly coat, a barrier to sperm entry) and the corona radiata (support and nutrients).","a":"corona radiata"},{"e":"Cortical granules release their contents upon fertilisation to prevent polyspermy.","a":"polyspermy"},{"e":"The egg is arrested in metaphase II until fertilised, so no nucleus actually forms until after fertilisation.","a":"arrested in metaphase II"}],"kw":["Head","Mid-piece","Tail","Acrosome","Axoneme","Zona pellucida","Corona radiata","Cortical granules","Polyspermy"],"tp":["Sperm: head (DNA + acrosome + centrioles), mid-piece (mitochondria), tail (axoneme)."]},{"t":"Compare **spermatogenesis and oogenesis**.","f":[{"e":"Location: spermatogenesis occurs entirely in the testes; oogenesis occurs mostly in the ovaries.","a":"entirely in the testes"},{"e":"Cytoplasm division: equal in spermatogenesis, unequal in oogenesis.","a":"unequal"},{"e":"Number of gametes: four sperm vs one ovum (plus polar bodies).","a":"one ovum"},{"e":"Timing: spermatogenesis is an uninterrupted process; oogenesis has arrested stages.","a":"arrested stages"},{"e":"Onset: spermatogenesis begins at puberty; oogenesis begins in the foetus (pre-natal).","a":"foetus"},{"e":"Release: sperm continuous; ovum monthly from puberty (menstrual cycle).","a":"monthly"},{"e":"End: spermatogenesis is lifelong (but reduces with age); oogenesis terminates with menopause.","a":"terminates with menopause"}],"kw":["Equal vs unequal","4 sperm vs 1 ovum","Continuous vs arrested","Puberty vs foetus","Lifelong vs menopause"],"tp":["Sperm = 4, continuous, from puberty. Ovum = 1, arrested stages, from foetus, ends at menopause."]},{"t":"Describe the roles of **hormones in the male** reproductive system.","f":[{"e":"Hypothalamus, pituitary gland and testes are involved. 4 key hormones: GnRH, FSH, LH and inhibin.","a":"inhibin"},{"e":"GnRH (hypothalamus) stimulates the pituitary gland to release FSH and LH.","a":"GnRH"},{"e":"LH (pituitary) acts on Leydig cells (interstitial cells) and stimulates the testes to produce testosterone.","a":"Leydig cells"},{"e":"FSH (pituitary) acts on Sertoli cells, stimulates maturation of sperm cells and concentrates testosterone in the seminiferous tubule.","a":"Sertoli cells"},{"e":"Inhibin (testes) is proportionate to the amount of sperm: high sperm = high inhibin, and high inhibin inhibits FSH.","a":"inhibits FSH"},{"e":"Testosterone develops and maintains male reproductive organs and secondary sexual characteristics, supports spermatogenesis, and gives negative feedback on the hypothalamus and pituitary.","a":"negative feedback"},{"e":"Key idea: hypothalamus → GnRH → pituitary → FSH & LH → testes → sperm production + testosterone.","a":"FSH & LH"}],"kw":["GnRH","FSH","LH (ICSH)","Inhibin","Testosterone","Leydig cells","Sertoli cells"],"tp":["LH → LEYDIG → testosterone. FSH → SERTOLI → sperm.","No FSH = no sperm cells."]},{"t":"Describe the roles of **hormones in the female** reproductive system.","f":[{"e":"Hypothalamus, pituitary gland and ovaries are involved. 6 key hormones: GnRH, FSH, LH, estrogen, progesterone and inhibin.","a":"6 key hormones"},{"e":"GnRH (hypothalamus) stimulates the pituitary gland to release FSH and LH.","a":"GnRH"},{"e":"FSH stimulates maturation of egg follicles and works with inhibin in a negative feedback cycle.","a":"maturation of egg follicles"},{"e":"LH stimulates ovulation and formation of the corpus luteum (LH surge triggers ovulation).","a":"LH surge"},{"e":"Estrogen (from follicles in the ovaries) stimulates the menstrual cycle, promotes secondary sexual features and rebuilds/thickens the endometrium.","a":"secondary sexual features"},{"e":"Progesterone (from the corpus luteum) helps maintain the uterine lining for pregnancy.","a":"maintain the uterine lining"},{"e":"Inhibin (ovaries) reduces FSH secretion. Low FSH = fewer developing follicles.","a":"reduces FSH"},{"e":"Sustained high estrogen gives positive feedback that triggers the LH surge; moderate estrogen gives negative feedback.","a":"positive feedback"}],"kw":["GnRH","FSH","LH","Estrogen","Progesterone","Inhibin","LH surge","Corpus luteum"],"tp":["FSH = follicle grows. LH = ovulation. Estrogen = rebuild lining. Progesterone = maintain lining."]},{"t":"Explain the **ovarian cycle and uterine (menstrual) cycle**.","f":[{"e":"The ovarian cycle occurs in the cortex of the ovary and describes changes in the follicles/eggs. The uterine cycle occurs in the uterus and describes changes in the endometrial lining.","a":"endometrial lining"},{"e":"Follicular phase (Day 1–14): FSH makes follicles develop and release estrogen.","a":"FSH"},{"e":"Ovulation (Day 14): rising estrogen triggers the LH surge, and the LH surge triggers release of the egg from the follicle.","a":"LH surge"},{"e":"Luteal phase (Day 14–28): the follicle becomes the corpus luteum, which releases progesterone (and estrogen).","a":"corpus luteum"},{"e":"Menstrual phase (Day 1–5): the inner lining of the endometrium is shed because progesterone drops from the dying corpus luteum.","a":"progesterone drops"},{"e":"Proliferative phase (Day 6–14): endometrium regrows due to rising estrogen from the follicular phase.","a":"estrogen"},{"e":"Secretory phase (Day 14–28): endometrium secretes nutrients to support a growing embryo, due to rising progesterone from the luteal phase.","a":"nutrients"},{"e":"No embryo → no corpus luteum → low progesterone → induces the menstrual phase.","a":"low progesterone"},{"e":"If fertilisation occurs, hormone levels stay high and the endometrium is maintained for implantation.","a":"implantation"}],"kw":["Follicular phase","Ovulation","Luteal phase","Menstrual phase","Proliferative phase","Secretory phase","Corpus luteum","Corpus albicans"],"tp":["Ovarian: FOLLICULAR → OVULATION → LUTEAL. Uterine: MENSES → PROLIFERATIVE → SECRETORY.","Your slides give both Day 1–14 and Day 1–13 for the follicular phase. Use Day 1–14 from the main slide, unless your lecturer says otherwise.","Basal body temperature rises after ovulation."]},{"t":"Describe methods to **track menstruation/ovulation** and types of **assisted reproductive technology (ART)**.","f":[{"e":"Tracking methods: menstrual calendar/app, ovulation predictor kit (OPK), basal body temperature (BBT), cervical mucus observation.","a":"OPK"},{"e":"OPK detects the LH surge in urine before ovulation.","a":"LH surge"},{"e":"BBT: body temperature rises slightly after ovulation.","a":"rises slightly"},{"e":"Cervical mucus becomes clear, slippery and stretchy near ovulation.","a":"stretchy"},{"e":"Clinical methods: hormone monitoring and ultrasound to monitor follicle development and ovulation.","a":"ultrasound"},{"e":"ART: timed intercourse, ovulation induction (OI), intrauterine insemination (IUI), in vitro fertilisation (IVF), intracytoplasmic sperm injection (ICSI), embryo transfer (ET).","a":"ICSI"},{"e":"IUI places washed, concentrated sperm directly into the uterus around ovulation. In IVF and ICSI fertilisation occurs in the laboratory.","a":"laboratory"},{"e":"ICSI: a single sperm is injected directly into an egg, often used for severe male factor infertility.","a":"single sperm"}],"kw":["OPK","BBT","Cervical mucus","IUI","IVF","ICSI","Embryo transfer"],"tp":["IUI = fertilisation INSIDE the body. IVF and ICSI = fertilisation in the LAB."]},{"t":"Differentiate **sexual and asexual reproduction in plants**, and describe the flower and pollination.","f":[{"e":"Sexual reproduction needs fusion of the male gamete (pollen) and female gamete (in the ovule) to form a zygote.","a":"zygote"},{"e":"Asexual reproduction results in a clone of genetically identical organisms; sexual reproduction gives genetically different offspring.","a":"clone"},{"e":"Flower parts: sepal (green, protects bud, collectively calyx), petal (attracts pollinators, collectively corolla), stamen (anther + filament; androecium), carpel (stigma, style, ovary; gynoecium).","a":"carpel"},{"e":"Stamen and carpel are the male and female reproductive organs; sepal and petal are accessory parts.","a":"accessory"},{"e":"Pollination is the transfer of pollen from anther to stigma, by wind, water, bee, moth, butterfly, fly, bird or bat.","a":"anther to stigma"},{"e":"Self-pollination: pollen goes to the same flower (autogamy) or another flower of the same plant (geitonogamy); less genetic diversity.","a":"less genetic diversity"},{"e":"Cross-pollination: pollen goes to another plant (xenogamy); greater genetic diversity.","a":"xenogamy"}],"kw":["Calyx","Corolla","Androecium","Gynoecium","Autogamy","Geitonogamy","Xenogamy"],"tp":["Your plant slide lists the 4 whorls as sepal, petal, stamen and 'corolla'. The 4th is the CARPEL (corolla = all the petals)."]},{"t":"Explain the **male and female gametophytes**, **double fertilisation**, seeds and fruits in angiosperms.","f":[{"e":"Angiosperms: the sporophyte (2n) is dominant; the gametophytes are reduced and depend on it. Remember the 3 Fs: flowers, double fertilisation, fruits.","a":"3 Fs"},{"e":"Male gametophyte: microsporocyte (2n) → meiosis → 4 microspores (n) → mitosis → pollen grain (generative cell + tube cell nucleus).","a":"pollen grain"},{"e":"Generative nucleus → 2 sperm. The tube nucleus makes the pollen tube, which grows into the ovary.","a":"2 sperm"},{"e":"Female gametophyte (embryo sac): megasporocyte (2n) → meiosis → 1 surviving megaspore (n) → mitosis → 3 antipodal cells, 2 polar nuclei, 1 egg, 2 synergids.","a":"embryo sac"},{"e":"Double fertilisation: sperm + egg = zygote (2n); sperm + two polar nuclei = endosperm (3n).","a":"endosperm (3n)"},{"e":"After double fertilisation each ovule develops into a seed and the ovary develops into a fruit.","a":"ovary develops into a fruit"},{"e":"Fruit types: simple (single/fused carpels), aggregate (one flower, many separate carpels), multiple (inflorescence), accessory (other floral parts too, e.g. apple).","a":"aggregate"}],"kw":["Microspore","Megaspore","Embryo sac","Pollen tube","Double fertilisation","Endosperm 3n","Zygote 2n","Cotyledon"],"tp":["Sperm + egg = 2n zygote. Sperm + 2 polar nuclei = 3n endosperm."]},{"t":"Describe reproduction in **gymnosperms, ferns and bryophytes**.","f":[{"e":"Gymnosperms: no flowers, 'naked' seeds, no double fertilisation. Sporophyte-dominated; the gametophyte stays dependent on the sporophyte.","a":"naked"},{"e":"Ferns reproduce by spores, in sporangia usually under the fronds, with alternation of generations (diploid sporophyte 2n and haploid gametophyte n).","a":"sporangia"},{"e":"Bryophytes (mosses, liverworts, hornworts) reproduce through spores. The gametophyte (n) is dominant and photosynthetic; the sporophyte (2n) stays attached to it.","a":"gametophyte (n) is dominant"},{"e":"Water is essential for fertilisation in bryophytes.","a":"Water"},{"e":"Asexual reproduction in plants: fragmentation, adventitious shoots, apomixis (seeds from a diploid cell) and vegetative propagation (cuttings, callus, grafting with stock and scion).","a":"apomixis"},{"e":"Asexual reproduction suits a stable environment, but a clone is vulnerable to extinction if the environment changes; sexual reproduction generates variation.","a":"variation"}],"kw":["Sporangia","Fronds","Alternation of generations","Apomixis","Callus","Stock and scion"],"tp":["Gymnosperm = naked seed. Moss = gametophyte dominant."]}],"m":["**Gametophyte** (n) makes gametes by mitosis. **Sporophyte** (2n) makes spores by meiosis.","**Ovulation** releases a **secondary oocyte** (arrested at metaphase II), not a mature ovum.","**Oogenesis** arrests at prophase I and metaphase II. Meiosis II finishes only if fertilised.","Spermatogenesis: **64–74 days**, continuous from puberty. One spermatocyte = **4 sperm**.","**LH → Leydig → testosterone. FSH → Sertoli → sperm.** Inhibin inhibits FSH.","**FSH** follicle growth, **LH surge** ovulation, **estrogen** rebuilds lining, **progesterone** maintains lining.","**No embryo → no corpus luteum → low progesterone → menstruation.**","**Double fertilisation:** sperm + egg = 2n zygote; sperm + 2 polar nuclei = 3n endosperm."],"x":[{"k":10,"q":"Q1 (Gametogenesis)\na) Name the gametogenesis process in males and in females. (2M)\nb) Differentiate spermatogenesis and oogenesis. Any 4 points. (4M)\nc) What happens to the secondary oocyte if (i) a sperm penetrates it, (ii) no sperm penetrates it? (4M)","a":["a) Spermatogenesis (male) and oogenesis (female)","b) Location: entirely in testes vs mostly in ovaries","b) Number: 4 sperm vs 1 ovum + polar bodies","b) Division: equal vs unequal cytoplasm; continuous vs arrested stages","b) Onset: puberty vs foetus; ends: lifelong vs menopause","c)(i) Meiosis II is completed","c)(i) Gives an ovum + second polar body; ovum + sperm = zygote (2n)","c)(ii) The secondary oocyte degenerates","c)(ii) Meiosis II is not completed"]},{"k":10,"q":"Q2 (Hormones, figure)\nA figure shows the pituitary gland sending hormone M to the ovary follicles and hormone N to the ovulation point and the corpus luteum structure R.\na) Name hormone M. (1M)\nb) Name process Q and the hormone that triggers it. (2M)\nc) Predict the change in hormone N and structure R if fertilisation does not occur. (3M)\nd) State the roles of estrogen and progesterone. (4M)","a":["a) FSH (follicle stimulating hormone)","b) Process Q = ovulation","b) Triggered by the LH surge (hormone N = LH)","c) Level of hormone N decreases slowly","c) Structure R (corpus luteum) degenerates","c) Low progesterone induces the menstrual phase","d) Estrogen: rebuilds endometrium, promotes secondary sexual features, causes LH surge","d) Progesterone: maintains the uterine lining for pregnancy"]},{"k":10,"q":"Q3 (Ovarian and uterine cycle)\na) State the three phases of the ovarian cycle and the three phases of the uterine cycle. (3M)\nb) Explain how estrogen and progesterone regulate the uterine cycle. (4M)\nc) Explain why menstruation happens if there is no embryo. (3M)","a":["a) Ovarian: follicular, ovulation, luteal","a) Uterine: menstrual, proliferative, secretory","b) Rising estrogen (follicular phase) causes the endometrium to regrow (proliferative, Day 6–14)","b) Rising progesterone (luteal phase) makes the endometrium secrete nutrients (secretory, Day 14–28)","b) Drop in progesterone sheds the lining (menstrual, Day 1–5)","c) No embryo → no corpus luteum","c) Low progesterone induces the menstrual phase"]},{"k":10,"q":"Q4 (Male system and hormones)\na) Trace the pathway of sperm from the testis to outside the body. (3M)\nb) State the function of the seminal vesicle, prostate and scrotum. (3M)\nc) Describe how inhibin controls sperm production. (4M)","a":["a) Seminiferous tubules/testis → epididymis → vas deferens → ejaculatory duct → urethra","b) Seminal vesicle: up to 80% of ejaculatory fluid","b) Prostate: adds additional fluid","b) Scrotum: protects the testicles","c) Inhibin comes from the testes and is proportional to the amount of sperm","c) High sperm = high inhibin","c) High inhibin inhibits FSH (negative feedback)","c) No FSH = no sperm cells"]},{"k":10,"q":"Q5 (Plant reproduction)\na) Name the male and female reproductive organs of a flower and their parts. (2M)\nb) Differentiate cross-pollination and self-pollination. (4M)\nc) Describe double fertilisation and state the products. (4M)","a":["a) Male: stamen (anther + filament); female: carpel (stigma, style, ovary)","b) Cross: pollen goes to the stigma of a different plant (xenogamy), needs pollinating agents","b) Cross: more genetic diversity","b) Self: pollen goes to the same flower (autogamy) or the same plant (geitonogamy)","b) Self: less genetic diversity","c) Pollen tube discharges 2 sperm into the embryo sac","c) Sperm + egg = zygote (2n)","c) Sperm + 2 polar nuclei = endosperm (3n)"]},{"k":10,"q":"Q6 (Sperm, egg and plant groups)\na) Name the three sections of a sperm. (3M)\nb) State the function of the acrosome, mitochondria and cortical granules. (3M)\nc) Differentiate angiosperm and gymnosperm reproduction, and name the dominant generation in mosses. (4M)","a":["a) Head, mid-piece, tail","b) Acrosome: hydrolytic enzymes penetrate the jelly coat","b) Mitochondria: ATP for the tail to move","b) Cortical granules: prevent polyspermy","c) Angiosperm: flowers, fruit-covered seeds, double fertilisation","c) Gymnosperm: no flowers, naked seeds, no double fertilisation","c) Moss: the gametophyte (n) is dominant"]}]},{"n":9,"t":"Growth & Development","o":[{"t":"Differentiate **growth** and **development**.","f":[{"e":"Growth is a permanent, non-reversible increase in size and mass of an organism.","a":"permanent, non-reversible"},{"e":"Growth happens by cell division (mitosis multiplies cell numbers) and cell enlargement (existing cells expand in volume).","a":"cell enlargement"},{"e":"Development is the transformation of unspecialised cells into highly complex, functional tissues.","a":"unspecialised cells"},{"e":"Development happens by morphogenesis (acquiring form and shape) and differentiation (stem cells become nerve, muscle or blood cells).","a":"differentiation"}],"kw":["Growth","Development","Mitosis","Morphogenesis","Differentiation"],"tp":["Growth = more bricks. Development = arranging the bricks into a working house."]},{"t":"Describe **fertilisation** in humans.","f":[{"e":"Fertilisation is the formation of a diploid zygote from a haploid egg and sperm.","a":"diploid zygote"},{"e":"Sperm capacitation: sperm matures in the female tract for about 10 hours. Cholesterol is removed from the membrane, which becomes fluid and fragile, allowing Ca²⁺ influx and increased motility.","a":"10 hours"},{"e":"Acrosomal reaction is triggered when the sperm meets the egg: the acrosome releases hydrolytic enzymes that digest material around the egg.","a":"hydrolytic enzymes"},{"e":"Actin filaments extend from the sperm head, penetrate the jelly coat and bind to receptors on the egg.","a":"actin filaments"},{"e":"A hole forms in the vitelline layer so the plasma membranes fuse. Na⁺ flows into the egg (depolarisation).","a":"depolarisation"},{"e":"Changes at the egg surface prevent polyspermy, the entry of multiple sperm nuclei.","a":"polyspermy"}],"kw":["Capacitation","Acrosomal reaction","Jelly coat","Depolarisation","Polyspermy","Zygote"],"tp":["Order: capacitation → acrosomal reaction → binding → fusion → depolarisation → block to polyspermy."]},{"t":"Describe **cleavage, gastrulation and organogenesis**.","f":[{"e":"Stages: fertilisation → cleavage → gastrulation → organogenesis → tissue specialisation.","a":"cleavage"},{"e":"Cleavage is rapid cell division without growth, dividing one large cell into many smaller cells called blastomeres.","a":"blastomeres"},{"e":"A fluid-filled cavity, the blastocoel, begins to form in the morula and is fully formed in the blastula.","a":"blastocoel"},{"e":"Gastrulation: cells move from the blastula surface to the interior, forming a three-layered embryo called a gastrula.","a":"three-layered"},{"e":"At the end of gastrulation the extraembryonic membranes (yolk sac, allantois, chorion, amnion) form.","a":"extraembryonic membranes"},{"e":"Early organogenesis: the notochord forms from mesoderm and the neural plate from ectoderm. The neural plate curves into the neural tube, which becomes the CNS (brain and spinal cord).","a":"neural tube"}],"kw":["Cleavage","Blastomeres","Morula","Blastula","Blastocoel","Gastrula","Neural tube","Notochord"],"tp":["Cleavage = division WITHOUT growth. Neural tube → brain + spinal cord."]},{"t":"Explain the roles of **placenta, chorion, amniotic fluid and allantois**, and the hormones of pregnancy.","f":[{"e":"The chorion develops into the placenta, which provides the fetus with nourishment and oxygen and takes away its waste.","a":"nourishment and oxygen"},{"e":"The allantois becomes the umbilical blood vessels, which take blood to and from the fetus.","a":"umbilical blood vessels"},{"e":"The yolk sac has plentiful blood vessels and is the first site of blood cell formation.","a":"blood cell formation"},{"e":"The amnion contains fluid (amniotic fluid) to cushion and protect the embryo.","a":"cushion and protect"},{"e":"First trimester: main period of organogenesis, heart begins beating at week 4; the placenta produces high hCG; high progesterone increases placental growth and uterine enlargement.","a":"hCG"},{"e":"Second trimester: hCG declines and the uterus grows.","a":"hCG declines"},{"e":"Third trimester: fetal activity may decrease as the fetus fills the space; high estrogen induces oxytocin, which stimulates prostaglandin secretion to enhance contraction.","a":"prostaglandin"}],"kw":["Chorion","Placenta","Allantois","Yolk sac","Amnion","hCG","Progesterone","Estrogen"],"tp":["Chorion = placenta. Allantois = umbilical vessels. Yolk sac = first blood cells. Amnion = cushion."]},{"t":"Explain the **roles of hormones in parturition** (giving birth).","f":[{"e":"After about 38 weeks from fertilisation the mother is ready to give birth. Parturition involves coordinated changes in both mother and foetus.","a":"38 weeks"},{"e":"The amnion typically ruptures just before birth and drains out of the vagina; the cervix dilates; strong contractions push the foetus through the cervix and out.","a":"cervix dilates"},{"e":"Receptors in the cervix sense pressure and signal the hypothalamus, which signals the posterior pituitary to secrete oxytocin.","a":"posterior pituitary"},{"e":"Estradiol (from the ovaries) activates oxytocin receptors on the uterus.","a":"oxytocin receptors"},{"e":"Oxytocin (from the fetus and the mother's posterior pituitary) stimulates the uterus to contract and the placenta to make prostaglandins.","a":"prostaglandins"},{"e":"Prostaglandins stimulate more uterine contractions. This is a positive feedback loop.","a":"positive feedback"},{"e":"Three stages: dilation stage → expulsion stage → placental stage.","a":"expulsion"}],"kw":["Oxytocin","Prostaglandin","Estradiol","Positive feedback","Dilation","Expulsion","Placental stage"],"tp":["Contractions → more oxytocin → more prostaglandin → more contractions (POSITIVE feedback).","Stages: DILATION → EXPULSION → PLACENTAL."]},{"t":"Describe **seed development, dormancy and germination** in plants.","f":[{"e":"After double fertilisation each ovule develops into a seed and the ovary wall develops into a fruit, adapted for seed dispersal.","a":"ovary wall"},{"e":"Endosperm development usually precedes embryo development. In monocots the endosperm stores nutrients for the seedling; in some dicots it is absorbed during seed development.","a":"endosperm"},{"e":"Monocot: one seed leaf (cotyledon). Dicot (eudicot): two seed leaves (cotyledons).","a":"one seed leaf"},{"e":"Seed dormancy: the seed is dehydrated until water content is about 5–15% of its weight, which reduces metabolic activity.","a":"5–15%"},{"e":"Germination needs adequate water, sufficient oxygen and favourable temperature. Stored food reserves are rapidly used.","a":"water"},{"e":"The embryonic root and shoot that break through the seed coat are the radicle and plumule.","a":"radicle"},{"e":"Two forms of germination: epigeal and hypogeal.","a":"hypogeal"}],"kw":["Cotyledon","Endosperm","Dormancy","Germination","Radicle","Plumule","Epigeal","Hypogeal"],"tp":["Germination needs: WATER, OXYGEN, TEMPERATURE.","Radicle = root, Plumule = shoot."]},{"t":"Describe **methods to measure growth**.","f":[{"e":"Microbial growth is an increase in the number of cells, not in the size of individual cells.","a":"number of cells"},{"e":"Direct methods count cells directly: no incubation, fast and simple, immediate estimate, but cannot distinguish living from dead cells.","a":"dead cells"},{"e":"Indirect methods estimate growth from cell mass or metabolic activity: easier, suitable for monitoring over time, need an incubation period and are affected by culture conditions.","a":"incubation period"},{"e":"Plant growth: number of fronds, fresh and dry weight, leaf surface area, number of annual growth rings.","a":"growth rings"},{"e":"Animal growth: weight (percentage of weight increase) and growth rings in bivalves.","a":"bivalves"}],"kw":["Direct method","Indirect method","Fresh weight","Dry weight","Growth rings"],"tp":["Direct = count cells (alive + dead). Indirect = measure mass/activity (needs incubation)."]},{"t":"Describe **growth patterns and growth rate**.","f":[{"e":"Limited growth stops at a maximum size; common in animals/humans and plant organs (leaves, fruits, flowers). It gives an S-shaped (sigmoid) curve.","a":"S-shaped"},{"e":"Sigmoid curve phases: A lag, B exponential, C transitional/linear, D stationary.","a":"lag"},{"e":"Unlimited growth continues throughout life; common in plants because meristems keep dividing. Apical meristems lengthen roots and shoots; lateral meristems thicken stems and roots.","a":"meristems"},{"e":"J curve: rapid exponential growth that suddenly stops when environmental resistance acts (e.g. bacteria, protozoa).","a":"J curve"},{"e":"Allometric growth: different parts grow at different rates, so proportions change (a baby's head is proportionally larger than an adult's).","a":"different rates"},{"e":"Isometric growth: all parts grow at about the same rate, so proportions stay almost unchanged.","a":"same rate"}],"kw":["Limited growth","Unlimited growth","Sigmoid curve","J curve","Meristem","Allometric","Isometric"],"tp":["ALLO = different rates. ISO = same rate."]},{"t":"Describe **ecdysis, metamorphosis and growth under extreme conditions**.","f":[{"e":"Insects and crustaceans have a hard exoskeleton that cannot expand, so growth is discontinuous. Ecdysis is periodic shedding of the exoskeleton, followed by a rapid size increase, giving a step-like growth curve.","a":"step-like"},{"e":"Complete metamorphosis: egg → larva → pupa → adult (butterfly). Larva feeds and grows; pupa reorganises tissue; adult is for reproduction and dispersal.","a":"pupa"},{"e":"Incomplete metamorphosis: egg → nymph → adult (grasshopper). The nymph resembles a smaller adult and goes through several ecdyses.","a":"nymph"},{"e":"Dormancy is a temporary period of reduced growth, development and metabolic activity to survive unfavourable conditions. It is usually reversible.","a":"reversible"},{"e":"Hibernation: dormancy in cold (bats, ground squirrels). Aestivation: dormancy in hot/dry conditions (snails, lungfish). Diapause: development stops at one life stage (insect eggs, larvae, pupae).","a":"aestivation"},{"e":"Plant dormancy (seeds, buds, bulbs) can be caused by a hard seed coat, an immature embryo, chemical inhibitors, or temperature/light requirements.","a":"chemical inhibitors"}],"kw":["Ecdysis","Metamorphosis","Dormancy","Hibernation","Aestivation","Diapause"],"tp":["Hibernation = cold. Aestivation = hot/dry. Diapause = insect development paused."]}],"m":["**Growth** = permanent increase in size/mass. **Development** = unspecialised cells become functional tissues.","**Cleavage** = rapid division without growth → blastomeres.","**Chorion** → placenta. **Allantois** → umbilical vessels. **Yolk sac** → first blood cells. **Amnion** → cushion.","Parturition is a **positive feedback loop**: oxytocin ↔ prostaglandin ↔ contractions.","Birth stages: **dilation → expulsion → placental**.","Germination needs **water, oxygen, favourable temperature**.","**Allometric** = different rates. **Isometric** = same rate.","**Hibernation** (cold), **aestivation** (hot/dry), **diapause** (insect stage)."],"x":[{"k":10,"q":"Q1 (Fertilisation and early development)\na) Differentiate growth and development. (2M)\nb) Describe cleavage and gastrulation. (4M)\nc) Describe the acrosomal reaction. (4M)","a":["a) Growth: permanent increase in size and mass","a) Development: unspecialised cells become functional tissues","b) Cleavage: rapid cell division without growth giving blastomeres","b) Blastocoel forms (morula → blastula)","b) Gastrulation: cells move inward forming a three-layered gastrula","c) Triggered when sperm meets the egg","c) Acrosome releases hydrolytic enzymes that digest material around the egg","c) Actin filaments penetrate the jelly coat and bind egg receptors","c) Membranes fuse; Na⁺ enters; changes at the egg surface prevent polyspermy"]},{"k":10,"q":"Q2 (Foetal development, figure)\na) Name the type of reproduction shown by sperm + egg → zygote → ball of cells. Name the process A (zygote to 2 cells) and the ball of cells. (3M)\nb) State the roles of the chorion, allantois, amnion and yolk sac. (4M)\nc) Describe the hormones involved in parturition. (3M)","a":["a) Sexual reproduction","a) Process A = cleavage; ball of cells = morula","b) Chorion develops into the placenta (nourishment, oxygen, waste removal)","b) Allantois forms the umbilical blood vessels","b) Amnion contains fluid to cushion and protect the embryo","b) Yolk sac is the first site of blood cell formation","c) Cervix receptors → hypothalamus → posterior pituitary releases oxytocin","c) Oxytocin stimulates contraction and prostaglandins","c) Positive feedback; estrogen increases oxytocin receptors"]},{"k":10,"q":"Q3 (Plant development)\na) Define seed dormancy. (2M)\nb) State three conditions for germination. (3M)\nc) Differentiate monocot and dicot seeds, and name the embryonic root and shoot. (5M)","a":["a) Seed dehydrated to 5–15% water; reduced metabolic activity","a) Seed stays dormant in unfavourable conditions before germination","b) Adequate water, sufficient oxygen, favourable temperature","c) Monocot: one cotyledon; endosperm stores nutrients for the seedling","c) Dicot: two cotyledons; endosperm absorbed/reduced","c) Embryonic root = radicle","c) Embryonic shoot = plumule","c) Germination may be epigeal or hypogeal"]},{"k":10,"q":"Q4 (Growth patterns)\na) Differentiate limited and unlimited growth with examples. (4M)\nb) Differentiate allometric and isometric growth. (3M)\nc) Name the four phases of the sigmoid curve. (3M)","a":["a) Limited: stops at a maximum size (animals/humans, leaves, fruits); S-shaped curve","a) Unlimited: continues through life (plants, meristems)","b) Allometric: parts grow at different rates, proportions change (baby head larger)","b) Isometric: all parts grow at about the same rate","c) Lag, exponential, transitional/linear, stationary"]},{"k":10,"q":"Q5 (Metamorphosis, dormancy, scenario)\na) Differentiate complete and incomplete metamorphosis. (4M)\nb) A lungfish buries itself in mud in the dry season, and bats reduce their heart rate in winter. Name each type of dormancy. (2M)\nc) Define dormancy and state two causes of seed dormancy. (2M)\nd) Differentiate direct and indirect methods of measuring microbial growth. (2M)","a":["a) Complete: egg → larva → pupa → adult (butterfly); larva and adult very different","a) Incomplete: egg → nymph → adult (grasshopper); nymph resembles smaller adult, several ecdyses","b) Lungfish: aestivation (hot/dry)","b) Bats: hibernation (cold)","c) Temporary reduced growth and metabolic activity; usually reversible","c) Hard seed coat, immature embryo, chemical inhibitors, temperature/light need","d) Direct: counts cells, fast, cannot tell dead from alive","d) Indirect: cell mass/metabolic activity, needs incubation"]}]},{"n":10,"t":"Biodiversity","o":[{"t":"Explain the **concept and levels of biodiversity**, and the five-kingdom and three-domain systems.","f":[{"e":"Biodiversity is the variety and complexity of all life on earth (bios = life, diversitas = variety).","a":"variety and complexity"},{"e":"Genetic diversity is the genetic variation within each species.","a":"within each species"},{"e":"Species diversity is the number of species and their relative abundance.","a":"relative abundance"},{"e":"Ecosystem diversity is the variation of habitats, communities and ecological processes within and between habitats/ecosystems.","a":"habitats"},{"e":"Classification order: Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species ('Dear King Philip Came Over For Good Soup').","a":"Dear King Philip"},{"e":"Five-kingdom system (Whittaker): Monera, Protista, Fungi, Plantae, Animalia.","a":"Whittaker"}],"kw":["Genetic diversity","Species diversity","Ecosystem diversity","Five kingdoms","Three domains"],"tp":["Dear King Philip Came Over For Good Soup = Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species.","Whittaker's year is typed as 1696 on this slide; the Taxonomy chapter says 1969."]},{"t":"Describe **Kingdom Monera** (Domains Bacteria and Archaea).","f":[{"e":"Monera lack a true nucleus: genetic material is in the nucleoid and plasmids.","a":"nucleoid"},{"e":"The cell wall is strengthened by peptidoglycan. Most are motile with flagella; some are autotrophs, others heterotrophs.","a":"peptidoglycan"},{"e":"Bacteria include cyanobacteria (blue-green algae) and are named partly by shape.","a":"cyanobacteria"},{"e":"Gram-positive: simpler wall with a large amount of peptidoglycan (Staphylococcus aureus). Gram-negative: less peptidoglycan plus an outer membrane that can be toxic (Escherichia coli).","a":"outer membrane"},{"e":"Archaea are extremophiles: methanogens (oxygen-free), halophiles (extreme saline) and thermoacidophiles (high temperature and acid).","a":"thermoacidophiles"},{"e":"Positive effects: nitrogen fixation/recycling, symbiotic E. coli in the human gut (vitamin K and B12), sewage treatment. Negative: pathogens (parasitic).","a":"vitamin K and B12"}],"kw":["Peptidoglycan","Nucleoid","Gram-positive","Gram-negative","Cyanobacteria","Methanogens","Halophiles","Thermoacidophiles"],"tp":["Archaea 3 groups: METHANOGENS (no oxygen), HALOPHILES (salt), THERMOACIDOPHILES (heat + acid)."]},{"t":"Describe **Kingdom Protista**.","f":[{"e":"Protists are eukaryotes, mostly unicellular, with some colonial and multicellular species. They are grouped into algae and protozoa.","a":"algae and protozoa"},{"e":"Algae have chlorophyll and photosynthesise, and have cell walls and vacuoles. Chlorophyta (green algae): chlorophyll a and b, e.g. Chlamydomonas. Phaeophyta (brown algae): chlorophyll a, c and fucoxanthin, e.g. Fucus.","a":"fucoxanthin"},{"e":"Protozoa are generally colourless and motile, and ingest organisms or organic particles.","a":"ingest"},{"e":"Euglenophyta: Euglena. Rhizopoda: Amoeba (pseudopodia). Ciliophora: Paramecium (cilia). Apicomplexa: Plasmodium (parasitic, spore-forming).","a":"pseudopodia"},{"e":"Positive effects: phytoplankton fixes CO₂ and makes O₂; edible seaweed (kombu kelp).","a":"phytoplankton"},{"e":"Negative effects: eutrophication, red tide (dinoflagellate neurotoxin) and malaria (Anopheles mosquito carrying Plasmodium).","a":"red tide"}],"kw":["Algae","Protozoa","Chlorophyta","Phaeophyta","Euglena","Amoeba","Paramecium","Plasmodium"],"tp":["Amoeba = pseudopodia. Paramecium = cilia. Plasmodium = malaria."]},{"t":"Describe **Kingdom Fungi**.","f":[{"e":"Fungi are heterotrophs that absorb nutrients from outside the body. The body is a mycelium (network of branched hyphae).","a":"absorb"},{"e":"Septate hyphae have septa with pores for cytoplasm movement; coenocytic hyphae have no septa (continuous cytoplasm with many nuclei).","a":"coenocytic"},{"e":"Zygomycota: sporangium fungi/common moulds, coenocytic hyphae. Ascomycota: sac fungi (yeast, cup fungi, truffles, morels), septate hyphae. Basidiomycota: club fungi (mushrooms, shelf fungi, puffballs, rusts, smuts) that make basidia.","a":"basidia"},{"e":"Reproduce asexually or sexually; both produce spores.","a":"spores"},{"e":"Positive effects: decomposers, symbionts on plant roots, food (tempe, cheese, mushrooms, beer), penicillin from Penicillium notatum.","a":"Penicillium"},{"e":"Negative effect: parasitic pathogens with haustoria that penetrate the host.","a":"haustoria"}],"kw":["Mycelium","Hyphae","Septate","Coenocytic","Zygomycota","Ascomycota","Basidiomycota","Haustoria"],"tp":["Zygo = sporangium. Asco = sac. Basidio = club."]},{"t":"Describe **Kingdom Plantae**: bryophytes, pteridophytes, gymnosperms, angiosperms.","f":[{"e":"Plants are sessile, so they use alternation of generations and two points of dispersal (pollen and seeds).","a":"pollen and seeds"},{"e":"Bryophytes (non-vascular): liverworts (Hepatophyta), hornworts (Anthocerophyta), mosses (Bryophyta). Gametophyte dominant; no true root, stem or leaf; lack vascular tissue/lignin; moist habitats.","a":"non-vascular"},{"e":"Pteridophytes (vascular, seedless): Lycophyta (club mosses, spike mosses, e.g. Selaginella) and Pterophyta (ferns, horsetails, whisk ferns). True root, stem, leaves (fronds), rhizome, spores.","a":"vascular, seedless"},{"e":"Homosporous ferns make one spore type (bisexual gametophyte); heterosporous make microspores and megaspores (unisexual gametophytes).","a":"heterosporous"},{"e":"Gymnosperms (vascular, naked seed): cones, no flower, no double fertilisation, heterosporous, sporophyte dominant. 4 phyla: Cycadophyta, Ginkgophyta (Ginkgo biloba), Gnetophyta, Coniferophyta (pine, redwood).","a":"4 phyla"},{"e":"Angiosperms (vascular, enclosed seed): one phylum, Anthophyta; two key adaptations: flowers and fruits. Classes: monocots and dicots.","a":"Anthophyta"}],"kw":["Bryophytes","Pteridophytes","Gymnosperms","Angiosperms","Lycophyta","Pterophyta","Anthophyta","Cycadophyta"],"tp":["Bryophyte = non-vascular. Fern = vascular, seedless. Gymnosperm = vascular, naked seed. Angiosperm = vascular, enclosed seed."]},{"t":"Describe **Kingdom Animalia** and **phylum Chordata** (vertebrate classes).","f":[{"e":"Animals are multicellular eukaryotes, heterotrophic, with no cell walls, differentiated tissues/organs and a complete nervous system.","a":"no cell walls"},{"e":"Chordates have a skull and backbone, notochord, dorsal tubular nerve cord, pharyngeal pouches/slits, post-anal tail and myotomes. Six classes.","a":"notochord"},{"e":"Chondrichthyes: cartilaginous fish (tiger shark, ray); no swim bladder, no operculum.","a":"cartilaginous"},{"e":"Osteichthyes: bony fish (tilapia, lungfish); swim bladder, gills with operculum.","a":"swim bladder"},{"e":"Amphibia: tetrapods without amniotic sac, ectothermic, gills and lungs (frog, toad). Reptilia: keratin skin, molting, amniotic eggs (lizard, crocodile).","a":"ectothermic"},{"e":"Aves: endothermic, feathers, hollow bones, forelimbs evolved into wings. Mammalia: endothermic, hair, mammary glands, four-chambered heart.","a":"mammary glands"}],"kw":["Notochord","Chondrichthyes","Osteichthyes","Amphibia","Reptilia","Aves","Mammalia"],"tp":["Six classes: Chondrichthyes, Osteichthyes, Amphibia, Reptilia, Aves, Mammalia."]},{"t":"Describe the **invertebrate phyla**.","f":[{"e":"Porifera (sponges): simplest aquatic animals (parazoans), no true tissue.","a":"no true tissue"},{"e":"Cnidaria: marine, polyp and medusa body forms, radial symmetry, nerve net, single mouth opening. Classes: Hydrozoa (Hydra), Scyphozoa (jellyfish), Anthozoa (sea anemone, coral).","a":"polyp and medusa"},{"e":"Platyhelminthes (flatworms): bilateral, unsegmented, flattened, digestive system with a single opening (mouth, no anus), no body cavity, hermaphrodites.","a":"no anus"},{"e":"Nematoda (roundworms): unsegmented, cylindrical, bilateral, with mouth and anus, complete digestive tract, dioecious.","a":"mouth and anus"},{"e":"Annelida: segmented worms with complete digestive tract. Oligochaeta (earthworm), Polychaeta (Nereis), Hirudinea (leeches).","a":"segmented"},{"e":"Arthropoda: segmented, chitinous exoskeleton, jointed appendages, growth by ecdysis. Subphyla: Chelicerata, Crustacea, Uniramia (and extinct Trilobita).","a":"chitinous exoskeleton"},{"e":"Echinodermata: marine, endoskeleton, radially symmetrical adults, anus above mouth, external fertilisation. Classes: Crinoidea, Asteroidea, Ophiuroidea, Echinoidea, Holothuroidea.","a":"radially symmetrical"},{"e":"Mollusca: soft body, CaCO₃ shell, head-foot, visceral mass, mantle, radula. 7 classes: Aplacophora, Monoplacophora, Polyplacophora, Gastropoda, Bivalvia, Cephalopoda, Scaphopoda.","a":"radula"}],"kw":["Porifera","Cnidaria","Platyhelminthes","Nematoda","Annelida","Arthropoda","Echinodermata","Mollusca"],"tp":["Flatworm = mouth only. Roundworm = mouth + anus.","Your slide spells Arthropoda as 'Anthropoda'."]},{"t":"Describe **biodiversity in Malaysia** and why it matters.","f":[{"e":"Malaysia is a megadiverse country, ranked 12th in the world (National Biodiversity Index).","a":"12th"},{"e":"About 15,000 species of vascular plants. Fauna: 307 mammals (30 endemic), 785 birds, 242 amphibians, 567 reptiles and 2,068 freshwater and marine fish.","a":"15,000"},{"e":"Hotspots: Maliau Basin, Danum Valley, Imbak Canyon, Kinabalu Parks, Lambir Hills NP.","a":"Maliau Basin"},{"e":"Importance: food security, forestry, fisheries, health (biological prospecting), tourism, ecosystem services, indigenous knowledge, biotechnology.","a":"biological prospecting"},{"e":"Ecotourism examples: Pulau Sipadan, Pulau Redang and Pulau Payar (diving).","a":"Sipadan"}],"kw":["Megadiverse","Endemic","Hotspot","Ecosystem services","Biological prospecting"],"tp":["Malaysia = 12th, 15,000 vascular plants, 307 mammals, 785 birds."]},{"t":"Identify the **threats to biodiversity** and the **IUCN Red List** categories.","f":[{"e":"IUCN threatened categories: vulnerable (likely to become endangered), endangered (at risk of becoming extinct), critically endangered (highest risk of extinction in the wild).","a":"critically endangered"},{"e":"Threat 1: habitat destruction and fragmentation (agriculture such as oil palm, logging, housing, roads). Fragmentation breaks large contiguous forest into smaller pieces.","a":"fragmentation"},{"e":"Threat 2: climate change (greenhouse gases CO₂ and methane, sea level rise, coral bleaching, floods, forest fire).","a":"greenhouse gases"},{"e":"Threat 3: pollution of soil, water and atmosphere (plastics, sewage and fertilisers causing algal growth, acid rain).","a":"acid rain"},{"e":"Threat 4: overexploitation: harvesting faster than populations can recover (pangolin trade).","a":"overexploitation"},{"e":"Threat 5: invasive alien species that prey on, compete with or bring disease to natives (peacock bass, water hyacinth).","a":"invasive alien species"}],"kw":["IUCN","Vulnerable","Endangered","Critically endangered","Habitat fragmentation","Overexploitation","Invasive species"],"tp":["5 threats: HABITAT loss, CLIMATE change, POLLUTION, OVEREXPLOITATION, INVASIVE species.","Critically endangered in Malaysia: Bornean orangutan, Malayan tiger, Sunda pangolin, Sumatran rhino."]},{"t":"Explain **conservation measures**: in-situ, ex-situ, sustainable development and wildlife crossings.","f":[{"e":"Sustainable development balances human economic and social needs with protecting the environment for present and future generations.","a":"sustainable development"},{"e":"Conservation is the management of human use of nature to yield the greatest sustainable benefit while keeping its potential for future generations.","a":"greatest sustainable benefit"},{"e":"In-situ conservation protects species in their natural habitat (national parks, sanctuaries, marine parks). Advantages: already adapted, more spacious, lower cost, bigger breeding population.","a":"natural habitat"},{"e":"Ex-situ conservation keeps species outside their habitat in human-controlled facilities (zoos/captive breeding, botanic gardens, seed banks such as Svalbard).","a":"seed banks"},{"e":"Ex-situ advantages: reproductive technology (artificial insemination, embryo transfer), protection from predation and poaching, genetic diversity can be measured.","a":"embryo transfer"},{"e":"Wildlife crossings (eco-bridges) reconnect habitat fragmented by roads, reduce wildlife-vehicle collisions and increase human safety.","a":"eco-bridges"}],"kw":["In-situ","Ex-situ","National park","Seed bank","Captive breeding","Sustainable development","Wildlife crossing"],"tp":["IN-situ = in the wild. EX-situ = outside (zoo, botanic garden, seed bank)."]}],"m":["**3 levels:** genetic, species, ecosystem diversity.","**Dear King Philip Came Over For Good Soup** (Domain → Species).","**Bacteria:** peptidoglycan wall. **Archaea:** methanogens, halophiles, thermoacidophiles.","**Fungi:** absorb nutrients; Zygo = sporangium, Asco = sac, Basidio = club.","**Gymnosperm:** naked seed, no double fertilisation. **Angiosperm:** flowers + fruits.","**Chordate classes (6):** Chondrichthyes, Osteichthyes, Amphibia, Reptilia, Aves, Mammalia.","**IUCN:** vulnerable → endangered → critically endangered.","**In-situ** = natural habitat. **Ex-situ** = zoo, botanic garden, seed bank."],"x":[{"k":10,"q":"Q1 (Kingdoms)\na) State the kingdom for: (i) elephant, (ii) bacteria, (iii) Rafflesia flower, (iv) mushroom. (4M)\nb) Differentiate Gram-positive and Gram-negative bacteria. (3M)\nc) Name the three levels of biodiversity. (3M)","a":["a) Elephant = Animalia","a) Bacteria = Monera","a) Rafflesia = Plantae","a) Mushroom = Fungi","b) Gram-positive: simpler wall, large amount of peptidoglycan","b) Gram-negative: less peptidoglycan plus an outer membrane that can be toxic","c) Genetic, species, ecosystem diversity"]},{"k":10,"q":"Q2 (Chordates, invertebrates)\na) Name the six classes of chordates. (3M)\nb) Identify the similarities of organisms classified as amphibia and fish. (4M)\nc) Differentiate Platyhelminthes and Nematoda. (3M)","a":["a) Chondrichthyes, Osteichthyes, Amphibia, Reptilia, Aves, Mammalia","b) Both are chordates: notochord, dorsal tubular nerve cord","b) Pharyngeal pouches/slits and post-anal tail","b) Both have a skull/backbone (vertebrates) and myotomes","c) Platyhelminthes: mouth only, no anus, no body cavity, hermaphrodite","c) Nematoda: mouth and anus, complete digestive tract, dioecious"]},{"k":10,"q":"Q3 (Plants and fungi)\na) Differentiate gymnosperms and angiosperms. (4M)\nb) State the characteristics of bryophytes. (3M)\nc) Describe the three phyla of fungi. (3M)","a":["a) Gymnosperm: naked seed, cones, no flower, no double fertilisation","a) Angiosperm: flowers and fruits, phylum Anthophyta","b) Non-vascular, gametophyte dominant, no true root/stem/leaf","c) Zygomycota: sporangium fungi, coenocytic hyphae","c) Ascomycota: sac fungi (yeast, truffles), septate","c) Basidiomycota: club fungi (mushrooms) with basidia"]},{"k":10,"q":"Q4 (Conservation scenario)\nThe turtle conservation centre in Sabah gazetted islands as a national park to protect the hatching of green turtles, an endangered species.\na) Differentiate in-situ and ex-situ conservation with examples. (4M)\nb) Describe the effects of the centre on the threatened species. (3M)\nc) Name the three IUCN threatened categories. (3M)","a":["a) In-situ: conserve in natural habitat (national park, sanctuary, marine park)","a) Ex-situ: outside natural habitat (zoo, botanic garden, seed bank)","b) Protected from predators, poaching and habitat loss in natural habitat","b) Larger breeding population and less cost to maintain","b) Species already adapted to resources there; population can recover","c) Vulnerable, endangered, critically endangered"]},{"k":10,"q":"Q5 (Threats and measures)\na) Discuss four threats to biodiversity. (4M)\nb) What is forest fragmentation and how do wildlife crossings help? (3M)\nc) Define sustainable development and state why biodiversity matters. (3M)","a":["a) Habitat destruction and fragmentation","a) Climate change","a) Pollution of soil, water, atmosphere","a) Overexploitation and invasive alien species","b) Breaking large forest into smaller pieces separated by roads/agriculture","b) Crossings reconnect habitat and reduce wildlife-vehicle collisions","c) Balance human economic/social needs with environmental protection for present and future","c) Food security, health, tourism, ecosystem services (any)"]}]},{"n":11,"t":"Taxonomy","o":[{"t":"Define **taxonomy, identification, nomenclature, classification, taxon and systematics**.","f":[{"e":"Taxonomy is the science of identifying and naming species and organising them into the existing system of classification.","a":"identifying and naming"},{"e":"Identification: determining the kind of species/taxon, comparing it with known ones and assigning a name.","a":"comparing"},{"e":"Nomenclature: naming the identified species correctly, using a scientific name or a vernacular (common) name. Example: Gallus gallus = chicken (English), ayam (Malay).","a":"vernacular"},{"e":"Classification: placing the named species/taxon into categories (arranging and grouping).","a":"categories"},{"e":"A taxon is a group of organisms that share a definite set of characters. Example: Zea mays is a taxon at species category; Poaceae is a taxon at family category.","a":"definite set of characters"},{"e":"Systematics is the study of biological diversity and the relationships among organisms.","a":"relationships among organisms"}],"kw":["Taxonomy","Identification","Nomenclature","Classification","Taxon","Systematics","Vernacular name"],"tp":["IDENTIFY → NAME → CLASSIFY.","Taxon = the group. Category = its rank (genus, species)."]},{"t":"Explain how a **taxonomist works**, where specimens are kept and the **importance of taxonomy**.","f":[{"e":"A taxonomist: collects specimens in the field (fieldwork), identifies the collection, curates the collection and reports data.","a":"curates"},{"e":"Specimens are stored in natural history museums, herbaria and botanical gardens.","a":"herbaria"},{"e":"Names help us understand relationships among species and allow efficient communication among scientists.","a":"efficient communication"},{"e":"It enables strategies for the protection and conservation of endangered and threatened species.","a":"conservation"},{"e":"It facilitates the study of anatomy, physiology and morphology of similar organisms, and helps predict characteristics of newly discovered species.","a":"predict characteristics"},{"e":"It helps us understand evolutionary patterns that give information on the origin and spread of beneficial and harmful varieties.","a":"evolutionary patterns"}],"kw":["Fieldwork","Curation","Herbarium","Museum","Botanical garden"],"tp":["4 steps: COLLECT → IDENTIFY → CURATE → REPORT."]},{"t":"Explain **binomial nomenclature** and the Linnaean system.","f":[{"e":"Binomial nomenclature is a two-name system: the genus name is written first, followed by the epithet, to form the species name (Felis catus, Homo sapiens, Gallus gallus).","a":"genus"},{"e":"A formal scientific name bears the author's name at the end (Quercus alba L., Fissidens nobilis Griff.).","a":"author"},{"e":"ICBN (International Code of Nomenclature for algae, fungi and plants) governs plants; ICZN (International Code of Zoological Nomenclature) governs animals.","a":"ICZN"},{"e":"For animals a trinomial (3-word) name is allowed to indicate a subspecies (Elephas maximus indicus, Elephas maximus borneensis).","a":"trinomial"},{"e":"The Linnaean system was set up by Carl Linnaeus in Systema Naturae (1735).","a":"1735"}],"kw":["Genus","Epithet","Binomial","ICBN","ICZN","Trinomial","Subspecies"],"tp":["ICBN = plants (algae, fungi). ICZN = animals. Both start with I-C-..."]},{"t":"Describe the **taxonomic hierarchy** and **classification systems**.","f":[{"e":"Linnaeus grouped species from broad to narrow: 7 main categories: Kingdom, Phylum (Division), Class, Order, Family, Genus, Species.","a":"Kingdom, Phylum"},{"e":"The kingdom is the largest, most inclusive grouping. The species is the smallest, most exclusive grouping: organisms similar enough to produce fertile offspring.","a":"fertile offspring"},{"e":"Example: Rafflesia keithii. Kingdom Plantae, Division Magnoliophyta, Class Magnoliopsida, Order Malpighiales, Family Rafflesiaceae, Genus Rafflesia.","a":"Malpighiales"},{"e":"Rafflesia arnoldii: largest single flower (Sumatra and Borneo). R. keithii: Sabah. R. tuan-mudae: Sarawak.","a":"keithii"},{"e":"Human example (slides): Domain Eukarya → Kingdom Animalia (organisms able to move on their own) → Phylum Chordata (backbone) → Class Mammalia (fur/hair, milk glands) → Order Primates → Family Hominidae → Genus Homo → Species Homo sapiens.","a":"Primates"},{"e":"Elephants: Family Elephantidae (order Proboscidea). Genus Elephas: Elephas maximus indicus (Asian Indian elephant), Elephas maximus borneensis (Borneo pygmy elephant). Genus Loxodonta: Loxodonta africana (African elephant).","a":"Proboscidea"},{"e":"Five-kingdom system (Whittaker, 1969): Monera, Protista, Fungi, Plantae, Animalia. Monera are prokaryotes; the other four are eukaryotes.","a":"1969"},{"e":"Three-domain system (Woese, 1990): Archaea, Bacteria, Eukarya. A domain is a superkingdom; Eukarya includes protists, plants, fungi and animals.","a":"Woese"}],"kw":["Kingdom","Phylum","Class","Order","Family","Genus","Species","Domain"],"tp":["Systems: LINNEAN (7 ranks), WHITTAKER 1969 (5 kingdoms), WOESE 1990 (3 domains)."]},{"t":"Explain **phenetics** (numerical taxonomy).","f":[{"e":"Phenetics is the study of relationships among organisms based on the degree of similarity between them.","a":"degree of similarity"},{"e":"The more similarities two organisms share, the more likely they belong to the same group. It generates a phenogram using algorithms.","a":"phenogram"},{"e":"Advantage: needs no previous knowledge of the taxon or its literature, only observations and quantification; easy for beginners.","a":"easy for beginners"},{"e":"Weakness: does not differentiate between homology and homoplasy, and is strict empiricism that rejects evolution theory.","a":"homoplasy"},{"e":"Example: corn, wheat and paddy (monocots, present = 1) group together; mango and cashew (dicots, aril present) group together.","a":"monocots"}],"kw":["Phenetics","Phenogram","Numerical taxonomy","Similarity","Homoplasy"],"tp":["Phenetics = SIMILARITY. Present = 1, absent = 0."]},{"t":"Explain **phylogenetics**: trees, groupings, homology and analogy.","f":[{"e":"Phylogenetics was founded much later (1940) by Willi Hennig. A phylogenetic tree is a hypothesis about evolutionary relationships.","a":"Willi Hennig"},{"e":"Branch point: divergence of two species. Sister taxa: share an immediate common ancestor. Rooted tree: includes the last common ancestor of all taxa. Basal taxon: diverges early. Polytomy: a branch from which more than two groups emerge.","a":"polytomy"},{"e":"Monophyletic: all species share a recent common ancestor and ALL its descendants are included.","a":"ALL its descendants"},{"e":"Paraphyletic: share a recent common ancestor but NOT all descendants are included (reptiles without birds).","a":"NOT all descendants"},{"e":"Polyphyletic: species with no immediate common ancestor are grouped together, excluding members that would link them.","a":"no immediate common ancestor"},{"e":"Homology is similarity due to shared ancestry (divergent evolution). Analogy is similarity due to convergent evolution (homoplasy).","a":"convergent evolution"},{"e":"Homologous structures are products of divergent evolution and are modified to perform different functions. Analogous structures are products of convergent evolution, when non-monophyletic groups independently evolve similar characteristics.","a":"non-monophyletic"},{"e":"Phylogenetic bracketing predicts features of an ancestor from features of its descendants.","a":"bracketing"}],"kw":["Phylogeny","Sister taxa","Basal taxon","Polytomy","Monophyletic","Paraphyletic","Polyphyletic","Homology","Analogy"],"tp":["MONO = all. PARA = some missing. POLY = unrelated clump.","Homology = ancestry. Analogy = convergence."]},{"t":"Explain **systematics** and **dichotomous keys**.","f":[{"e":"Systematics provides the means for characterising organisms and produces classifications that reflect evolutionary relationships, allowing predictions and testable hypotheses.","a":"evolutionary relationships"},{"e":"Classifications provide a key to the literature and a means of organising information. Example: identifying pest insects at different stages (larvae, adults) for pest management.","a":"pest management"},{"e":"A dichotomous key is a tool for identifying organisms. A lead is one statement; two contrasting leads form a couplet.","a":"couplet"},{"e":"Two types: bracketed (parallel) key and yoked (indented) key.","a":"yoked"},{"e":"Example key: animal without appendages → with shell = snail; without shell → unsegmented scaly body = snake, segmented = earthworm. With appendages: 3 pairs → with wings = cockroach, without = bull ant; more than 3 pairs = spider.","a":"bull ant"}],"kw":["Systematics","Dichotomous key","Lead","Couplet","Bracketed key","Yoked key"],"tp":["Lead = one choice. Couplet = the pair of contrasting leads."]}],"m":["**Taxonomy** = identifying + naming + classifying. **Systematics** = diversity + relationships.","**Binomial:** Genus + epithet. **ICBN** plants, **ICZN** animals. Trinomial = subspecies (animals).","**7 ranks:** Kingdom, Phylum, Class, Order, Family, Genus, Species.","**Whittaker 1969** = 5 kingdoms. **Woese 1990** = 3 domains.","**Phenetics** = similarity. **Phylogenetics** = evolutionary relationships.","**Monophyletic** = all descendants. **Paraphyletic** = some left out. **Polyphyletic** = no common ancestor.","**Homology** = shared ancestry. **Analogy** = convergent evolution.","**Couplet** = two contrasting **leads**."],"x":[{"k":10,"q":"Q1 (Hierarchy)\na) Complete the classification of humans: X (above Kingdom), Y, and Z (class). Domain/X: Eukaryota; Kingdom: Animalia; Phylum: Chordata; Class: Z; Order: Primates; Family: Hominidae. (3M)\nb) Briefly describe the importance of taxonomy. (4M)\nc) Two elephant sub-species and Loxodonta africana share a common history. Give 3 taxonomic categories that include all three. (3M)","a":["a) X = Domain (Eukarya)","a) Y = Kingdom","a) Z = Mammalia","b) Efficient communication among scientists","b) Protection and conservation of endangered species","b) Study of anatomy/physiology/morphology and predicting characters of new species","b) Understand evolutionary patterns","c) Family Elephantidae","c) Order Proboscidea","c) Class Mammalia (or Phylum Chordata / Kingdom Animalia)"]},{"k":10,"q":"Q2 (Naming)\na) Define taxon and give one example with its category. (2M)\nb) Explain binomial nomenclature and the codes that govern it. (4M)\nc) Differentiate identification, nomenclature and classification. (4M)","a":["a) Group of organisms sharing a definite set of characters; Zea mays = species","b) Two-name system: genus then epithet","b) Author's name at the end of the formal name","b) ICBN for algae, fungi, plants; ICZN for animals","c) Identification: determining kind, comparing, assigning a name","c) Nomenclature: naming correctly (scientific or vernacular)","c) Classification: placing into categories (grouping)"]},{"k":10,"q":"Q3 (Classification methods)\na) Differentiate phenetics and phylogenetics. (4M)\nb) Differentiate monophyletic, paraphyletic and polyphyletic groups. (3M)\nc) Differentiate homology and analogy with an example. (3M)","a":["a) Phenetics: similarity-based, phenogram, numerical taxonomy; no evolution","a) Phylogenetics: evolutionary relationships, phylogenetic tree (Hennig, 1940)","b) Monophyletic: common ancestor and all descendants","b) Paraphyletic: common ancestor, not all descendants (reptiles)","b) Polyphyletic: no immediate common ancestor","c) Homology: shared ancestry (divergent evolution), e.g. forelimbs","c) Analogy: convergent evolution, e.g. wings"]},{"k":10,"q":"Q4 (Dichotomous key and systematics)\na) Define lead and couplet. (2M)\nb) Use the key: animal with appendages, 3 pairs of appendages, with wings. Identify it. (2M)\nc) Name the two types of dichotomous key. (2M)\nd) Explain the importance of systematics with an example. (4M)","a":["a) Lead = one statement; couplet = two contrasting leads","b) Cockroach","c) Bracketed (parallel) key and yoked (indented) key","d) Characterises organisms and gives classifications that reflect evolutionary relationships","d) Allows predictions and testable hypotheses","d) Provides a key to the literature and organises information","d) Example: identifying pest insects at all stages (larva/adult) for pest management"]}]},{"n":12,"t":"Variation & Evolution","o":[{"t":"Explain **variation**: definition, types, sources and significance.","f":[{"e":"Variation is the difference between organisms of the same species. The mechanisms are gene mutation and the environment.","a":"same species"},{"e":"Biological species concept: a group of populations whose members can interbreed in nature and produce viable, fertile offspring.","a":"viable, fertile offspring"},{"e":"Inherited variation = genes, fixed. Acquired (non-heritable) variation = individual activities, nutrition, environment (e.g. height, tan).","a":"acquired"},{"e":"Continuous variation: gradation with two extremes, quantitative, influenced by environment and genes (height, weight).","a":"gradation"},{"e":"Discontinuous variation: no gradation, a limited number of distinct forms, qualitative, caused by genes (blood type, fingerprints).","a":"distinct forms"},{"e":"Sources: sexual reproduction (random fertilisation, random assortment of chromosomes), hybridisation (human intervention), environmental factors.","a":"random assortment"},{"e":"Environment examples from the slides: apples differ by position on the tree (acquired during the growing season); Nemoria moths show different phenotypes due to dietary chemicals; Nepenthes show phenotypic plasticity (leaf thickness, pitcher size, pigment) with sunlight and elevation (Hisham et al., 2022).","a":"Nemoria"},{"e":"Geographic variation: isolated mouse populations on Madeira. Mummichog fish vary in a cold-adaptive allele along a temperature gradient.","a":"Mummichog"},{"e":"Significance: raw material for natural selection, allows adaptation, helps some survive challenges, drives evolution and speciation.","a":"raw material"}],"kw":["Variation","Inherited","Acquired","Continuous","Discontinuous","Biological species concept"],"tp":["Continuous = gradation (height). Discontinuous = distinct classes (blood group)."]},{"t":"Explain **natural selection** and the modes of selection.","f":[{"e":"Observation 1: members of a population vary in inherited traits. Observation 2: species produce more offspring than the environment can support.","a":"more offspring"},{"e":"Inference: individuals with traits that raise survival and reproduction leave more offspring, so favourable traits accumulate over generations.","a":"accumulate"},{"e":"Natural selection is differential reproductive success among phenotypes: 'survival of the fittest'. Variation already exists; nature selects the best-adapted.","a":"differential reproductive success"},{"e":"Directional selection: one extreme is favoured (industrial melanism, Biston betularia).","a":"one extreme"},{"e":"Disruptive selection: both extremes are favoured over the intermediate.","a":"both extremes"},{"e":"Stabilising selection: intermediates are favoured; common in nature.","a":"intermediates"},{"e":"Sexual selection: one sex (usually female) chooses impressive males, passing on their genes. Artificial selection: humans breed individuals with desired traits (cabbage, broccoli, kale from wild mustard).","a":"artificial selection"}],"kw":["Natural selection","Fitness","Directional","Disruptive","Stabilising","Sexual selection","Artificial selection"],"tp":["Directional = ONE extreme. Disruptive = BOTH extremes. Stabilising = MIDDLE."]},{"t":"Explain **speciation** and reproductive isolation.","f":[{"e":"Speciation is the formation of a new species from an existing species, caused by reproductive isolating mechanisms.","a":"reproductive isolating"},{"e":"Allopatric speciation: a population splits into geographically isolated populations that evolve independently.","a":"geographically isolated"},{"e":"Sympatric speciation: species diverge while living in the same habitat (non-geographical).","a":"same habitat"},{"e":"Prezygotic barriers: habitat, temporal, behavioural, mechanical and gametic isolation (block fertilisation).","a":"gametic"},{"e":"Postzygotic barriers: zygotic mortality, hybrid inviability, hybrid sterility.","a":"hybrid sterility"},{"e":"Sexual selection can drive sympatric speciation: mate choice for different colours has likely contributed to speciation of cichlid fish in Lake Victoria.","a":"cichlid"},{"e":"Four factors of speciation: isolation, hybridisation, genetic drift, adaptive radiation.","a":"adaptive radiation"}],"kw":["Speciation","Allopatric","Sympatric","Prezygotic","Postzygotic","Reproductive isolation"],"tp":["ALLO = apart (geography). SYM = same place.","Prezygotic = BEFORE zygote. Postzygotic = AFTER zygote."]},{"t":"Explain **genetic drift** (bottleneck and founder effects) and **adaptive radiation**.","f":[{"e":"Genetic drift is a change in allele frequencies due to chance; it is significant in small populations and tends to reduce variation through loss of alleles.","a":"chance"},{"e":"Bottleneck effect: a disaster (fire, earthquake, flood) shrinks the population; survivors do not represent the original gene pool.","a":"bottleneck"},{"e":"Founder effect: a few individuals colonise an isolated island, so colonists do not represent the larger gene pool (Pitcairn Island, Tristan da Cunha).","a":"founder effect"},{"e":"Genetic drift can cause harmful alleles to become fixed.","a":"fixed"},{"e":"Adaptive radiation: diverse species form from one ancestor when it invades different habitats with different selection pressures (Darwin's finches; divergent evolution).","a":"Darwin's finches"}],"kw":["Genetic drift","Bottleneck effect","Founder effect","Adaptive radiation","Divergent evolution"],"tp":["Bottleneck = population shrinks. Founder = a few colonise a new place."]},{"t":"Compare **Lamarckism and Darwinism**, and describe the **evidence and speed of evolution**.","f":[{"e":"Lamarck (1809): use and disuse of body parts and inheritance of acquired characteristics (giraffe neck). Refuted because of genetic factors.","a":"acquired characteristics"},{
